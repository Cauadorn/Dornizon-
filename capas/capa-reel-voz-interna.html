<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face{font-family:Poppins;src:url(../reel-ems/assets/fonts/Poppins-Regular.ttf);font-weight:400}
@font-face{font-family:Poppins;src:url(../reel-ems/assets/fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:Poppins;src:url(../reel-ems/assets/fonts/Poppins-SemiBold.ttf);font-weight:600}
@font-face{font-family:IS;src:url(../reel-ems/assets/fonts/InstrumentSerif-Regular.ttf);font-style:normal}
@font-face{font-family:IS;src:url(../reel-ems/assets/fonts/InstrumentSerif-Italic.ttf);font-style:italic}
:root{--ivory:#fffbde;--tinta:#2a1433;--violeta:#6225d8;--violeta2:#7b4df2;--lavanda:#c0a5c4;--lavanda2:#e4d6e6;--pink:#dd34a8;--manteiga:#f2cf7a;--wine:#9e122c}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{position:relative;background:var(--tinta) radial-gradient(rgba(192,165,196,.22) 3px,transparent 3.5px) 0 0/60px 60px;font-family:Poppins;color:var(--ivory)}
.a{position:absolute}
.c{left:540px;transform:translateX(-50%)}
.label{font:500 26px/1 Poppins;letter-spacing:.08em;white-space:nowrap}
.lead{font:500 78px/1 Poppins;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:22px}
.nao{display:inline-block;background:var(--lavanda);color:var(--tinta);font:600 78px/1 Poppins;padding:.14em .3em .18em;border-radius:14px;box-shadow:8px 8px 0 var(--violeta);transform:rotate(-4deg)}
.serif{font-family:IS;font-size:318px;line-height:.82;letter-spacing:-.02em;white-space:nowrap;color:var(--ivory);text-align:center}
.serif em{font-style:italic;color:var(--manteiga)}
.serif .q{font-style:italic;color:var(--pink)}
.sel{border:3px solid var(--manteiga)}
.sel i{position:absolute;width:22px;height:22px;background:var(--ivory);border:3px solid var(--violeta)}
.sel i:nth-child(1){left:-12px;top:-12px}.sel i:nth-child(2){right:-12px;top:-12px}.sel i:nth-child(3){left:-12px;bottom:-12px}.sel i:nth-child(4){right:-12px;bottom:-12px}
.pill{background:var(--manteiga);color:var(--tinta);font:500 26px/1 Poppins;padding:9px 16px;border-radius:6px;white-space:nowrap}
.name{position:absolute;color:var(--tinta);font:600 36px/1 Poppins;padding:.32em .6em;border-radius:10px;white-space:nowrap;box-shadow:4px 4px 0 var(--tinta)}
.track{position:absolute;left:110px;width:860px;height:150px;border-radius:20px;background:#1d0d24;border:3px solid rgba(255,251,222,.9)}
.bars{position:absolute;left:28px;top:26px;right:28px;bottom:26px;display:flex;align-items:center;gap:10px}
.bars b{flex:1;border-radius:999px}
.ring{position:absolute;border-radius:50%;opacity:.5}
#grain{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:.07;pointer-events:none}
</style></head><body>

<!-- estrelas espelhadas -->
<img class="star a" style="left:-520px;top:470px;width:980px;height:980px;opacity:.4;transform:rotate(-14deg)">
<img class="star a" style="left:620px;top:470px;width:980px;height:980px;opacity:.4;transform:rotate(14deg) scaleX(-1)">

<!-- faixa da voz (topo) -->
<div class="a label" style="left:110px;top:300px;color:var(--lavanda)">voz_interna.mp3</div>
<div class="a label" style="left:970px;top:300px;transform:translateX(-100%);color:var(--lavanda)">volume: 136%</div>
<div class="track" style="top:344px;box-shadow:8px 8px 0 var(--violeta)"><div class="bars" id="b1"></div></div>

<!-- título -->
<div class="a c lead" style="top:614px"><span>eu</span><span class="nao">não</span><span>tenho</span></div>

<div class="a sel" style="left:86px;top:744px;width:908px;height:560px"><i></i><i></i><i></i><i></i></div>
<div class="a c serif" style="top:770px">cri<em>a</em>ti</div>
<div class="a c serif" style="top:1032px">vidade<span class="q">?</span></div>
<div class="a c pill" style="top:1326px">908 × 560</div>

<!-- cursores nos cantos opostos da seleção -->
<div class="ring" style="left:51px;top:709px;width:70px;height:70px;border:4px solid var(--lavanda)"></div>
<div class="a" style="left:77px;top:738px;transform:scale(1.3);transform-origin:9px 6px">
 <svg width="56" height="56" viewBox="0 0 24 24"><path d="M3 2 L21 10 L12.5 12.5 L9 21 Z" fill="#c0a5c4" stroke="#2a1433" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
<div class="name" style="background:var(--lavanda);left:86px;top:650px">voz</div>

<div class="ring" style="left:958px;top:1270px;width:70px;height:70px;border:4px solid var(--manteiga)"></div>
<div class="a" style="left:985px;top:1298px;transform:rotate(180deg) scale(1.3);transform-origin:9px 6px">
 <svg width="56" height="56" viewBox="0 0 24 24"><path d="M3 2 L21 10 L12.5 12.5 L9 21 Z" fill="#f2cf7a" stroke="#2a1433" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
<div class="name" style="background:var(--manteiga);left:906px;top:1340px">eu</div>

<!-- faixa do eu (base) -->
<div class="a label" style="left:110px;top:1452px;color:var(--manteiga)">eu.mp3</div>
<div class="a label" style="left:970px;top:1452px;transform:translateX(-100%);color:var(--manteiga)">volume: 140%</div>
<div class="track" style="top:1496px;box-shadow:8px 8px 0 var(--violeta)"><div class="bars" id="b2"></div></div>

<img id="grain" alt="">
<script>
(function(){const size=900,color='#7b4df2';const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');
const cx=size/2,cy=size/2,R=size*.49,r=R*.45;const pts=[];
for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5;const rr=i%2?r:R;pts.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)]);}
const path=new Path2D();pts.forEach((p,i)=>i?path.lineTo(...p):path.moveTo(...p));path.closePath();
g.fillStyle=color;const step=size/64;
for(let y=step/2;y<size;y+=step)for(let x=step/2;x<size;x+=step){if(!g.isPointInPath(path,x,y))continue;const d=Math.hypot(x-cx,y-cy)/R;const rad=step*.48*(1-d*.82);if(rad>.6){g.beginPath();g.arc(x,y,rad,0,7);g.fill();}}
document.querySelectorAll('.star').forEach(e=>e.src=c.toDataURL());})();
function bars(id,color,amp,seed){const el=document.getElementById(id);const n=26;
 for(let i=0;i<n;i++){const v=.25+.75*Math.abs(Math.sin(i*.9+seed)*Math.cos(i*.37-seed*2));let h=v*amp;const clip=h>1;h=Math.min(1,h);const b=document.createElement('b');b.style.height=Math.max(10,h*96)+'px';b.style.background=clip?'#9e122c':color;el.appendChild(b);}}
bars('b1','#c0a5c4',1.7,3.1);bars('b2','#f2cf7a',1.75,1.2);
const gc=document.createElement('canvas');gc.width=540;gc.height=960;const gg=gc.getContext('2d');const im=gg.createImageData(540,960);
for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}
gg.putImageData(im,0,0);document.getElementById('grain').src=gc.toDataURL('image/jpeg',.8);
</script>
</body></html>
