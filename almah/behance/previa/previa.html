<title>Almah no Behance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* prévia do projeto como ele fica no Behance: módulos de 1400 px colados, motions em vídeo */
:root { --fundo: #EDEAE6; --tinta: #1b1720; --sub: #6b6470; color-scheme: light; }
body { margin: 0; background: var(--fundo); color: var(--tinta); font-family: 'Helvetica Neue', Arial, sans-serif; }
.topo { max-width: 1400px; margin: 0 auto; padding: 28px max(16px, env(safe-area-inset-right, 0px)) 22px max(16px, env(safe-area-inset-left, 0px)); display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.topo h1 { font-size: 18px; font-weight: 600; margin: 0; }
.topo p { font-size: 13px; color: var(--sub); margin: 0; max-width: 640px; }
.capa { max-width: 1400px; margin: 0 auto 40px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--sub); }
.capa img { width: min(404px, 100%); border-radius: 6px; display: block; }
.projeto { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; }
.projeto img, .projeto video { width: 100%; height: auto; display: block; }
</style>
<header class="topo"><h1>Almah · Identidade Visual</h1><p>Prévia do projeto no Behance. A fotografia conduz; as legendas seguem as fases da lua, do crescente da abertura à lua cheia do "Obrigada". Os dois motions aparecem aqui em vídeo; no upload, use os GIFs.</p></header>
<div class="capa"><img src="m/capa.webp" alt="Capa: a mão segura a vela diante da lua, com a chama desenhada acesa"><span>Capa 808 × 632 (há também a versão animada em GIF).</span></div>
<main class="projeto" id="projeto"></main>
<script>
var MODS = ['01-abertura.mp4', '02-nome.webp', '03-o-traco.webp', '04-legenda-o-traco.webp', '05-logo-acendendo.mp4', '06-do-traco-a-luz.webp', '07-legenda-a-luz.webp', '08-colecao-genesis.webp', '09-legenda-genesis.webp', '10-cinco-ceus.webp', '11-fotos-do-produto.webp', '12-entrega.webp', '13-legenda-seu-pedido-chegou.webp', '14-caixa-aberta.webp', '15-legenda-abrir.webp', '16-faca-da-caixa.webp', '17-envelope.webp', '18-cuidados.webp', '19-legenda-cuidar.webp', '20-kit-completo.webp', '21-cores-e-letras.webp', '22-obrigada.webp'];
var alvo = document.getElementById('projeto');
MODS.forEach(function (f) {
  var el;
  if (/\.mp4$/.test(f)) { el = document.createElement('video'); el.muted = true; el.loop = true; el.autoplay = true; el.playsInline = true; el.setAttribute('playsinline', ''); el.src = 'm/' + f; }
  else { el = document.createElement('img'); el.src = 'm/' + f; el.alt = f.replace(/^\d+-|\.\w+$/g, '').replace(/-/g, ' '); el.loading = 'lazy'; }
  alvo.appendChild(el);
});
</script>
