<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Almah · brand boards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aboreto&family=Buenard:wght@400;700&family=Fleur+De+Leah&family=Poppins:ital,wght@0,300;0,400;0,500;1,300&display=swap">
<link rel="stylesheet" href="../kit/kit.css">
<style>
/* brand boards para o Pinterest: blocos de cor colados, selos redondos, estampa, mockups e paleta.
   A: 1000 × 1500 (2:3) · B e C: 1080 × 1920 (9:16) */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #222; font-family: var(--f-texto); font-weight: 300; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 40px; padding: 40px; }
.board { position: relative; overflow: hidden; flex: 0 0 auto; background: var(--papel); }
.svg > svg { width: 100%; height: 100%; display: block; overflow: visible; }
.bloco { position: absolute; overflow: hidden; }
.bloco > img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rp { background: var(--roxo-profundo); color: var(--creme); }
.nt { background: var(--noite); color: var(--creme); }
.pp { background: var(--papel); color: var(--roxo-profundo); }
.cr { background: #FBF3DF; color: var(--roxo-profundo); }
.centro { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.olho { font-weight: 500; letter-spacing: .32em; text-transform: uppercase; }
.selo { position: absolute; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 7px #FBF6EA, 0 18px 30px -10px #1c172677; display: flex; align-items: center; justify-content: center; }
.selo .svg { width: 52%; height: 52%; }
.anel { position: absolute; inset: 0; }
.anel text { font-family: var(--f-texto); font-weight: 500; letter-spacing: .28em; text-transform: uppercase; }

/* ============ A · 1000 × 1500 ============ */
#A { width: 1000px; height: 1500px; }
#A .credito { left: 0; top: 0; width: 1000px; height: 52px; font-size: 11px; }
#A .credito b { font-weight: 500; color: var(--ouro); }
#A .topo { left: 0; top: 52px; width: 1000px; height: 520px; }
#A .topo .logo { width: 380px; height: 259px; margin-top: -34px; }
#A .fila { position: absolute; left: 0; right: 0; top: 498px; height: 150px; display: flex; justify-content: center; gap: 14px; z-index: 3; }
#A .fila .selo { position: relative; width: 142px; height: 142px; }
#A .b2e { left: 0; top: 572px; width: 500px; height: 464px; }
#A .b2e .logo { width: 300px; height: 204px; }
#A .b2e .olho { font-size: 12px; margin-top: 24px; opacity: .85; }
#A .b2d { left: 500px; top: 572px; width: 500px; height: 464px; }
#A .b3e { left: 0; top: 1036px; width: 500px; height: 464px; }
#A .b3d { left: 500px; top: 1036px; width: 500px; height: 464px; background-size: 150px; }
#A .b3d .janela { position: absolute; right: -60px; bottom: -80px; width: 470px; height: 530px; border-radius: 999px 999px 0 0; overflow: hidden; box-shadow: 0 0 0 10px #FBF6EA; }
#A .b3d .janela img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 60%; }

/* ============ B · 1080 × 1920 ============ */
#B { width: 1080px; height: 1920px; }
#B .tintas { left: 0; top: 0; width: 1080px; height: 44px; display: flex; }
#B .tintas i { flex: 1; }
#B .topo { left: 0; top: 44px; width: 1080px; height: 560px; }
#B .topo .marca-dagua { position: absolute; right: -260px; top: -60px; width: 620px; height: 660px; color: var(--roxo-profundo); opacity: .07; }
#B .topo .logo { width: 470px; height: 320px; position: relative; margin-top: -70px; }
#B .topo .olho { font-size: 14px; margin-top: 30px; color: var(--roxo-profundo); position: relative; }
#B .be { left: 0; top: 604px; width: 540px; height: 500px; }
#B .be .svg { width: 230px; height: 245px; }
#B .bd { left: 540px; top: 604px; width: 540px; height: 500px; }
#B .bd .nome { width: 330px; height: 76px; }
#B .bd .olho { font-size: 12px; margin-top: 22px; opacity: .8; }
#B .bd .s { width: 58px; height: 62px; margin-bottom: 26px; color: var(--ouro); }
#B .selo.badge { left: 445px; top: 509px; width: 190px; height: 190px; background: var(--papel); z-index: 3; }
#B .selo.badge .svg { width: 36%; height: 36%; color: var(--roxo-profundo); }
#B .faixa { left: 0; top: 1104px; width: 1080px; height: 290px; background-size: 145px; }
#B .foto { left: 0; top: 1394px; width: 1080px; height: 526px; }
#B .foto img { object-position: 50% 42%; }

/* ============ C · 1080 × 1920 ============ */
#C { width: 1080px; height: 1920px; background: #FBF3DF; }
#C .topo { left: 0; top: 0; width: 1080px; height: 640px; background: #FBF3DF; }
#C .topo .lua { position: absolute; color: var(--roxo-profundo); }
#C .topo .lua.l1 { left: -470px; top: -150px; width: 760px; height: 809px; transform: rotate(-24deg); }
#C .topo .lua.l2 { right: -470px; top: 20px; width: 720px; height: 766px; transform: rotate(150deg); opacity: .9; }
#C .topo .est { position: absolute; color: var(--roxo-profundo); }
#C .topo .logo { position: relative; width: 400px; height: 272px; color: var(--roxo-profundo); }
#C .topo .olho { position: relative; font-size: 13px; margin-top: 26px; color: var(--roxo-profundo); }
#C .ce { left: 0; top: 640px; width: 540px; height: 520px; }
#C .ce .roda { position: relative; width: 340px; height: 340px; }
#C .ce .roda .svg.s { position: absolute; left: 50%; top: 50%; width: 110px; height: 117px; transform: translate(-50%, -54%); color: var(--creme); }
#C .ce .roda .anel { color: var(--creme); }
#C .cd { left: 540px; top: 640px; width: 540px; height: 520px; }
#C .cd img.rot { width: 400px; transform: rotate(-5deg); box-shadow: 0 24px 50px -16px #12091dcc; border-radius: 4px; }
#C .cartoes { left: 30px; top: 1190px; width: 1020px; height: 540px; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 18px; overflow: visible; }
#C .cartao { position: relative; border-radius: 22px; overflow: hidden; }
#C .cartao > img { width: 100%; height: 100%; object-fit: cover; display: block; }
#C .cartao.nuvens { background: var(--papel); }
#C .cartao.nuvens .nv { position: absolute; color: var(--roxo-profundo); opacity: .9; }
#C .cartao.nuvens .circ { position: absolute; left: 50%; top: 50%; width: 190px; height: 190px; transform: translate(-50%, -50%); border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 6px var(--roxo-profundo); }
#C .cartao.nuvens .circ img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 60%; }
#C .cartao.estampa { background-size: 120px; }
#C .cartao.alto { grid-column: 3; grid-row: 1 / span 2; }
#C .paleta { left: 0; top: 1760px; width: 1080px; height: 130px; display: flex; justify-content: center; gap: 30px; }
#C .paleta i { width: 128px; height: 128px; border-radius: 50%; }
</style>
</head>
<body>

<!-- A -->
<section class="board" id="A">
  <div class="bloco nt centro credito"><span class="olho">Identidade visual · <b>Emilly</b> &amp; <b>Cauã Dorn</b></span></div>
  <div class="bloco pp centro topo"><span class="logo svg" data-svg="logo-almah"></span></div>
  <div class="fila">
    <span class="selo pp"><span class="svg" data-svg="simbolo" style="color:var(--roxo-profundo)"></span></span>
    <span class="selo rp"><span class="svg" data-svg="simbolo"></span></span>
    <span class="selo" data-estampa="#503B69,#F5ECD7,90"></span>
    <span class="selo cr"><span class="svg" data-svg="nome" style="width:70%;height:20%;color:var(--roxo-profundo)"></span></span>
    <span class="selo" data-estampa="#FFEBB4,#503B69,90"></span>
    <span class="selo nt"><span class="svg" data-raios="n:36;de:0;ate:360;r0:22;r1:96;peso:.6;semente:3" style="width:100%;height:100%;position:absolute;opacity:.5"></span><span class="svg" data-svg="simbolo" style="position:relative;width:40%;height:40%"></span></span>
  </div>
  <div class="bloco rp centro b2e"><span class="logo svg" data-svg="logo-almah"></span><span class="olho">Velas aromáticas feitas à mão</span></div>
  <div class="bloco b2d"><img src="../assets/img/mock-envelope.jpg" alt="" style="object-position:50% 40%"></div>
  <div class="bloco b3e"><img src="../assets/img/mock-entrega.jpg" alt="" style="object-position:50% 62%"></div>
  <div class="bloco b3d" data-estampa="#FFEBB4,#503B69,150"><div class="janela"><img src="../assets/img/mock-vela-selene.jpg" alt=""></div></div>
</section>

<!-- B -->
<section class="board" id="B">
  <div class="bloco tintas"><i style="background:#503B69"></i><i style="background:#1C1726"></i><i style="background:#7138B7"></i><i style="background:#FFEBB4"></i></div>
  <div class="bloco pp centro topo"><span class="marca-dagua svg" data-svg="simbolo"></span><span class="logo svg" data-svg="logo-almah"></span><span class="olho">Velas aromáticas · Coleção Gênesis</span></div>
  <div class="bloco rp centro be"><span class="svg" data-svg="simbolo"></span></div>
  <div class="bloco nt centro bd"><span class="s svg" data-svg="simbolo"></span><span class="nome svg" data-svg="nome"></span><span class="olho">Feito à mão, com carinho</span></div>
  <span class="selo badge"><svg class="anel" id="anelB" viewBox="0 0 220 220"></svg><span class="svg" data-svg="simbolo"></span></span>
  <div class="bloco faixa" data-estampa="#503B69,#F5ECD7,145"></div>
  <div class="bloco foto"><img src="../assets/img/mock-kit.jpg" alt=""></div>
</section>

<!-- C -->
<section class="board" id="C">
  <div class="bloco centro topo">
    <span class="lua l1 svg" data-svg="lua"></span>
    <span class="lua l2 svg" data-svg="lua"></span>
    <svg class="est" style="left:300px;top:110px;width:26px;height:26px" viewBox="-1 -1 2 2" fill="currentColor"><path d="M0-1C.07-.24.24-.07 1 0 .24.07.07.24 0 1-.07.24-.24.07-1 0-.24-.07-.07-.24 0-1Z"/></svg>
    <svg class="est" style="left:760px;top:520px;width:20px;height:20px" viewBox="-1 -1 2 2" fill="currentColor"><path d="M0-1C.07-.24.24-.07 1 0 .24.07.07.24 0 1-.07.24-.24.07-1 0-.24-.07-.07-.24 0-1Z"/></svg>
    <svg class="est" style="left:820px;top:90px;width:14px;height:14px" viewBox="-1 -1 2 2" fill="currentColor"><path d="M0-1C.07-.24.24-.07 1 0 .24.07.07.24 0 1-.07.24-.24.07-1 0-.24-.07-.07-.24 0-1Z"/></svg>
    <span class="logo svg" data-svg="logo-almah"></span>
    <span class="olho">Coleção Gênesis</span>
  </div>
  <div class="bloco nt centro ce"><div class="roda"><svg class="anel" id="anelC" viewBox="0 0 340 340"></svg><span class="svg s" data-svg="simbolo"></span></div></div>
  <div class="bloco rp centro cd"><img class="rot" src="../assets/img/rotulo-selene.png" alt=""></div>
  <div class="bloco cartoes">
    <div class="cartao nuvens"><span class="nv svg" data-svg="nuvem-linha-2" style="left:-30px;top:20px;width:220px;height:72px"></span><span class="nv svg" data-svg="nuvem-linha-3" style="right:-30px;bottom:14px;width:200px;height:60px"></span><div class="circ"><img src="../assets/img/mock-vela-venus.jpg" alt=""></div></div>
    <div class="cartao"><img src="../assets/img/mock-caixa.jpg" alt="" style="object-position:50% 50%"></div>
    <div class="cartao alto"><img src="../assets/img/mock-cuidados.jpg" alt="" style="object-position:40% 50%"></div>
    <div class="cartao"><img src="../assets/img/mock-envelope.jpg" alt="" style="object-position:50% 45%"></div>
    <div class="cartao estampa" data-estampa="#FFEBB4,#503B69,120"></div>
  </div>
  <div class="bloco paleta"><i style="background:#503B69"></i><i style="background:#1C1726"></i><i style="background:#7138B7"></i><i style="background:#FFEBB4"></i><i style="background:#F5ECD7;box-shadow:inset 0 0 0 3px #503B69"></i></div>
</section>

<script src="../kit/svgs.js"></script>
<script src="../kit/kit.js"></script>
<script>
/* texto em volta dos selos */
function anel(svg, r, texto, tam, cor) {
  var NS = 'http://www.w3.org/2000/svg', c = svg.viewBox.baseVal.width / 2, id = svg.id + 'p';
  var p = document.createElementNS(NS, 'path');
  p.setAttribute('id', id); p.setAttribute('fill', 'none');
  p.setAttribute('d', 'M' + c + ',' + (c - r) + ' a' + r + ',' + r + ' 0 1,1 -0.01,0');
  var t = document.createElementNS(NS, 'text'); t.setAttribute('font-size', tam); t.setAttribute('fill', cor);
  var tp = document.createElementNS(NS, 'textPath'); tp.setAttribute('href', '#' + id); tp.textContent = texto;
  t.appendChild(tp); svg.appendChild(p); svg.appendChild(t);
  // estica as letras para fechar a volta
  var L = p.getTotalLength(), w = t.getComputedTextLength(); tp.setAttribute('textLength', (L - 2).toFixed(1)); tp.setAttribute('lengthAdjust', 'spacing');
}
anel(document.getElementById('anelB'), 84, 'Almah · velas feitas à mão · coleção gênesis · ', 13, '#503B69');
anel(document.getElementById('anelC'), 140, 'almah · almah · almah · almah · almah · almah · ', 22, '#FFEBB4');
</script>
</body>
</html>
