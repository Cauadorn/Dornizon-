<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>EMS · série preço · capas</title>
<style>
@font-face{font-family:"Instrument Serif";src:url(fonts/InstrumentSerif-Regular.ttf);font-style:normal}
@font-face{font-family:"Instrument Serif";src:url(fonts/InstrumentSerif-Italic.ttf);font-style:italic}
@font-face{font-family:"Poppins";src:url(fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:"Poppins";src:url(fonts/Poppins-SemiBold.ttf);font-weight:600}
html,body{margin:0;background:#111}*{box-sizing:border-box}
#c{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:Poppins}
#c>*{position:absolute}
.foto{inset:0;width:1080px;height:1350px;object-fit:cover}
/* cabeçalho fino, igual nas três: @ à esquerda, série à direita */
.tag{left:110px;top:90px;font:500 24px/1 Poppins;padding:.36em .7em .36em .5em;border-radius:5px;color:#fffbde;white-space:nowrap}
.tag svg{position:absolute;left:-19px;bottom:-21px}
.serie{left:326px;top:100px;font:500 19px/1 Poppins;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.serie b{font-weight:600}
/* a entrada da frase: cartão-adesivo colado em cima do começo da palavra 3D */
.cartao{font:600 38px/1.12 Poppins;padding:18px 26px 20px;border-radius:20px;white-space:nowrap;transform-origin:0 100%;box-shadow:7px 8px 0 rgba(42,20,51,.55)}
/* o fecho: serifa grande na base, uma palavra em itálico */
.fecho{left:90px;font:400 58px/.98 "Instrument Serif";letter-spacing:-.015em;white-space:nowrap}
.fecho em{font-style:italic}
</style></head><body><div id="c"></div><script>
const V={
 quilo:{n:1,ink:'#fffbde',tag:'#6225d8',cart:['#fffbde','#2a1433',90,676,-5,'marca não<br>se vende no'],fecho:[1146,'o que entra no <em>prato</em><br>de uma identidade visual.','#f2cf7a']},
 credito:{n:2,ink:'#2a1433',tag:'#dd34a8',cart:['#2a1433','#fffbde',90,772,-5,'no débito<br>ou no'],fecho:[1140,'o que vem na <em>notinha</em><br>de uma identidade visual.','#dd34a8']},
 bolinha:{n:3,ink:'#fffbde',tag:'#dd34a8',cart:['#fffbde','#2a1433',90,612,-5,'design não é<br>máquina de'],fecho:[1146,'não é pôr a moeda<br>e sair marca <em>pronta.</em>','#f2cf7a']},
};
const k=new URLSearchParams(location.search).get('v')||'quilo',v=V[k];
const cur='<svg width="28" height="28" viewBox="0 0 24 24"><path d="M3 2 L21 10 L12.5 12.5 L9 21 Z" fill="#2a1433" stroke="#fffbde" stroke-width="1.6" stroke-linejoin="round"/></svg>';
document.getElementById('c').innerHTML=`<img class="foto" src="cenas/${k}.png">
 <span class="tag" style="background:${v.tag}">@itsemsdesign${cur}</span>
 <span class="serie" style="color:${v.ink}">série preço · <b>0${v.n}</b> / 03</span>
 <span class="cartao" style="left:${v.cart[2]}px;top:${v.cart[3]}px;background:${v.cart[0]};color:${v.cart[1]};transform:rotate(${v.cart[4]}deg)">${v.cart[5]}</span>
 <span class="fecho" style="top:${v.fecho[0]}px;color:${v.ink}">${v.fecho[1].replace('<em>',`<em style="color:${v.fecho[2]}">`)}</span>`;
</script></body></html>
