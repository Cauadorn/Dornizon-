<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>EMS · série preço · capas</title>
<style>
@font-face{font-family:"Instrument Serif";src:url(fonts/InstrumentSerif-Regular.ttf);font-style:normal}
@font-face{font-family:"Instrument Serif";src:url(fonts/InstrumentSerif-Italic.ttf);font-style:italic}
@font-face{font-family:"Poppins";src:url(fonts/Poppins-Regular.ttf);font-weight:400}
@font-face{font-family:"Poppins";src:url(fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:"Poppins";src:url(fonts/Poppins-SemiBold.ttf);font-weight:600}
html,body{margin:0;background:#111}*{box-sizing:border-box}
#c{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:Poppins;color:#fffbde}
#c>*{position:absolute}
.foto{inset:0;width:1080px;height:1350px;object-fit:cover}
.tag{font:500 24px/1 Poppins;padding:.36em .7em .36em .5em;border-radius:5px;color:#fffbde;white-space:nowrap}
.tag svg{position:absolute;left:-19px;bottom:-21px}
.serie{font:500 19px/1 Poppins;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.serie b{font-weight:600}
.serif{font-family:"Instrument Serif";font-weight:400;letter-spacing:-.015em;white-space:nowrap}
.serif em{font-style:italic}
.cartao{font:600 38px/1.12 Poppins;padding:18px 26px 20px;border-radius:20px;white-space:nowrap;transform-origin:0 100%;box-shadow:7px 8px 0 rgba(42,20,51,.55)}
/* tira de notinha: papel marfim com a ponta serrilhada */
.tira{transform-origin:0 100%;filter:drop-shadow(5px 7px 0 rgba(42,20,51,.35))}
.tira b{display:block;font:600 36px/1 Poppins;color:#2a1433;background:#fffbde;padding:20px 52px 22px 28px;white-space:nowrap;clip-path:polygon(0 0,96% 0,100% 8.3%,96% 16.6%,100% 25%,96% 33.3%,100% 41.6%,96% 50%,100% 58.3%,96% 66.6%,100% 75%,96% 83.3%,100% 91.6%,96% 100%,0 100%)}
/* notinha */
.nota{color:#2a1433;text-align:center;transform-origin:50% 0}
.nota .cab{font:500 17px/1 Poppins;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.nota .lin{display:flex;align-items:baseline;gap:10px;font:500 27px/1 Poppins;margin-top:17px;text-align:left}
.nota .lin i{flex:1;border-bottom:3px dotted rgba(42,20,51,.45);transform:translateY(-5px)}
.nota .lin b{font-weight:600}
.nota hr{border:0;border-top:3px dashed #2a1433;margin:24px 0 18px}
</style></head><body><div id="c"></div><script>
const cur='<svg width="28" height="28" viewBox="0 0 24 24"><path d="M3 2 L21 10 L12.5 12.5 L9 21 Z" fill="#2a1433" stroke="#fffbde" stroke-width="1.6" stroke-linejoin="round"/></svg>';
const tag=(x,y,bg)=>`<span class="tag" style="left:${x}px;top:${y}px;background:${bg}">@itsemsdesign${cur}</span>`;
const V={
 // 01 · adesivo colado na palavra + fecho em serifa encaixado embaixo dela
 quilo:`<img class="foto" src="cenas/quilo.png">
  ${tag(110,90,'#6225d8')}
  <span class="cartao" style="left:90px;top:704px;background:#fffbde;color:#2a1433;transform:rotate(-5deg)">marca não<br>se vende no</span>
  <span class="serif" style="left:90px;top:1132px;font-size:60px;line-height:.96">o que entra no <em style="color:#f2cf7a">prato</em><br>de uma identidade visual.</span>`,
 // 02 · a entrada é um pedaço da própria notinha, colado na palavra; fecho em serifa logo abaixo
 credito:`<img class="foto" src="cenas/credito.png">
  ${tag(110,90,'#dd34a8')}
  <span class="tira" style="left:84px;top:756px;transform:rotate(-4deg)"><b>no débito ou no</b></span>
  <span class="serif" style="left:90px;top:1126px;font-size:60px;line-height:.96;color:#2a1433">o que vem na <em style="color:#dd34a8">notinha</em><br>de uma identidade visual.</span>`,
 // 03 · manchete em serifa empilhada na palavra + pílula colada embaixo
 bolinha:`<img class="foto" src="cenas/bolinha.png">
  ${tag(110,90,'#dd34a8')}
  <span class="serif" style="left:88px;top:574px;font-size:92px;line-height:.86">design não é<br>máquina de</span>
  <span class="cartao" style="left:90px;top:1066px;background:#dd34a8;color:#fffbde;font-size:32px;border-radius:999px;padding:16px 30px 17px;transform:rotate(-2deg);box-shadow:6px 7px 0 rgba(42,20,51,.6)">não é pôr a moeda e sair marca pronta.</span>`,
};
const k=new URLSearchParams(location.search).get('v')||'quilo';document.getElementById('c').innerHTML=V[k];
</script></body></html>
