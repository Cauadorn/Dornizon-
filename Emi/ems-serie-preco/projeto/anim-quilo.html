<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>EMS · quilo · capa animada</title>
<style>
@font-face{font-family:"Instrument Serif";src:url(fonts/InstrumentSerif-Regular.ttf);font-style:normal}
@font-face{font-family:"Instrument Serif";src:url(fonts/InstrumentSerif-Italic.ttf);font-style:italic}
@font-face{font-family:"Poppins";src:url(fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:"Poppins";src:url(fonts/Poppins-SemiBold.ttf);font-weight:600}
html,body{margin:0;background:#111}*{box-sizing:border-box}
#c{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:Poppins;color:#fffbde;background:#3d1c46}
#cam{position:absolute;left:0;top:0;width:1080px;height:1350px;transform-origin:50% 40%}
#cena{position:absolute;left:0;top:0;width:1024px;height:1280px;transform-origin:0 0;transform:scale(1.0546875)}
#cena img,#prato img{position:absolute;display:block}
#prato,#bal{position:absolute;left:0;top:0;width:1024px;height:1280px}
#bal{transform:translateY(-80px)}   /* a balança sobe um pouco: o mostrador fica livre acima da palavra */
#bal img{position:absolute;display:block}
/* prato mais raso: achatado na vertical a partir do fundo (onde encaixa no pescoço), a abertura fica menos funda */
#l-bal-prato,#l-bal-prato-aro{transform-origin:50% 223px;transform:scaleY(.8)}
.sp{position:absolute;height:18px;border-radius:50%;background:rgba(58,22,96,.6);filter:blur(5px)}
#sombra{position:absolute;width:90px;height:18px;border-radius:50%;background:rgba(30,8,40,.55);filter:blur(6px)}
#brilho{position:absolute;left:0;top:0;width:1024px;height:1280px;-webkit-mask:url(camadas/quilo/palavra-mask.png) 0 0/1024px 1280px no-repeat;mask:url(camadas/quilo/palavra-mask.png) 0 0/1024px 1280px no-repeat;mix-blend-mode:screen;overflow:hidden}
#faixa{position:absolute;top:600px;left:0;width:340px;height:600px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,240,250,.85) 45%,rgba(255,255,255,.95) 50%,rgba(255,240,250,.85) 55%,rgba(255,255,255,0))}
#c>.t{position:absolute}
.tag{left:110px;top:90px;font:500 24px/1 Poppins;padding:.36em .7em .36em .5em;border-radius:5px;color:#fffbde;background:#6225d8;white-space:nowrap;transform-origin:0 100%}
.tag svg{position:absolute;left:-19px;bottom:-21px}
.cartao{left:90px;top:704px;font:600 38px/1.12 Poppins;padding:18px 26px 20px;border-radius:20px;white-space:nowrap;transform-origin:0 100%;box-shadow:7px 8px 0 rgba(42,20,51,.55);background:#fffbde;color:#2a1433}
.fecho{left:90px;top:1146px;font:400 58px/.96 "Instrument Serif";letter-spacing:-.015em;white-space:nowrap}
.fecho em{font-style:italic;color:#f2cf7a}
.fecho span{display:block;overflow:hidden}.fecho span i{display:block;font-style:normal}
</style>
</head>
<body>
<div id="c">
  <div id="cam"><div id="cena">
    <img src="camadas/quilo/fundo.png" style="left:0;top:0">
    <div id="bal">
      <img id="corpo" src="camadas/quilo/bal-corpo.png">
      <img id="pont" src="camadas/quilo/ponteiro.png">
      <div id="prato"></div>
    </div>
    <img src="camadas/quilo/palavra.png" style="left:0;top:0">
    <div id="sombra"></div>
    <img id="l-ar2" src="camadas/quilo/ar2.png">
    <div id="brilho"><div id="faixa"></div></div>
  </div></div>
  <span class="t tag" id="tag">@itsemsdesign<svg width="28" height="28" viewBox="0 0 24 24"><path d="M3 2 L21 10 L12.5 12.5 L9 21 Z" fill="#2a1433" stroke="#fffbde" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
  <span class="t cartao" id="cartao">marca não<br>se vende no</span>
  <span class="t fecho" id="fecho"><span><i>o que entra no <em>prato</em></i></span><span><i>de uma identidade visual.</i></span></span>
</div>
<script>
const FPS=30,DUR=6.4;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,t0,d)=>clamp((t-t0)/d);
const outCubic=p=>1-Math.pow(1-p,3);
const mola=p=>p<=0?0:p>=1?1:1-Math.exp(-6.5*p)*Math.cos(11*p);
const pancada=(t,t0,freq=17,amort=5.5)=>t<t0?0:Math.exp(-amort*(t-t0))*Math.sin(freq*(t-t0));
const $=id=>document.getElementById(id);
let M;
// a pilha da arte, um pouco menor, assentada dentro do prato da balança nova
const ESC=.93,CX=490,CY=392,DESCE=27,DX=-6;   // os pés chegam até a borda da frente: não sobra prato vazio   // as peças pousam no fundo do prato, dentro da abertura: nada passa por trás da parede, nada é cortado nem escurece
const AJUSTE={cursor:[-46,-8],estrela:[-22,2]};   // o cursor e a estrela entram mais pra dentro do prato, pra não sumirem atrás da borda
const casa=(m,k)=>{const a=AJUSTE[k]||[0,0];return{x:CX+(m.x-CX)*ESC+DX+a[0],y:CY+(m.y-CY)*ESC+DESCE+a[1],w:m.w*ESC,h:m.h*ESC}};
// camadas do prato, de trás pra frente: tudo fica atrás da borda da frente, dentro da tigela
const ORDEM=['bal-prato','amostra1','amostra2','amostra3','amostra4','ar1','A','a','estrela','cursor','bal-prato-aro'];
const COM_SOMBRA=['A','a','estrela','cursor'];   // sombra de contato no fundo do prato: a peça assenta, não flutua
// o prato começa vazio. cada peça: quando pousa, quanto pesa (graus no ponteiro), de que giro vem
const QUEDA=[   // cadência rápida: uma peça atrás da outra, o ponteiro sobe sem parar
 {id:'A',pouso:.62,peso:17,giro:-22}, {id:'a',pouso:.88,peso:13,giro:18},
 {id:'amostra1',pouso:1.12,peso:6,giro:-30}, {id:'amostra2',pouso:1.30,peso:6,giro:20},
 {id:'amostra3',pouso:1.48,peso:6,giro:-16}, {id:'amostra4',pouso:1.66,peso:6,giro:26},
 {id:'estrela',pouso:1.90,peso:6,giro:160}, {id:'cursor',pouso:2.16,peso:11,giro:-40},
 {id:'ar1',pouso:2.46,peso:7,giro:-150,alvo:[652,292],fim:52},   // a amostra lilás que estava no ar: cai deitada dentro do prato
];
const TQ=.30,TOTAL=QUEDA.reduce((s,q)=>s+q.peso,0);
// a estrelinha: cai, bate no alto da pilha, quica e vai parar no chão, na frente da palavra
const E2={sai:2.50,bate:2.82,topo:[585,50],chao:[928,1168],voo:.70};

function render(t){
  let dip=0;QUEDA.forEach(q=>{dip+=.6*q.peso*pancada(t,q.pouso,16,5.2)});dip+=3*pancada(t,E2.bate,18,6);
  const carga=QUEDA.reduce((s,q)=>s+q.peso*clamp((t-q.pouso)*40),0)/TOTAL;
  $('prato').style.transform=`translateY(${dip+5*carga-5}px)`;
  COM_SOMBRA.forEach(k=>{const q=QUEDA.find(x=>x.id===k),p=P(t,q.pouso-TQ,TQ);$('s-'+k).style.opacity=.75*p*p*p;$('s-'+k).style.transform=`scale(${.4+.6*p})`;});
  QUEDA.forEach(q=>{const h=casa(M[q.id],q.id),e=$('l-'+q.id),p=P(t,q.pouso-TQ,TQ),cai=p*p;
    const dx=q.alvo?q.alvo[0]-(h.x+h.w/2):0,dy=q.alvo?q.alvo[1]-(h.y+h.h/2):0;
    const y0=-(h.y+h.h+110),quique=-14*Math.abs(pancada(t,q.pouso,13,7.5));
    const amassa=1-.07*Math.max(0,Math.sin(Math.PI*P(t,q.pouso,.16)));
    e.style.opacity=t<q.pouso-TQ?0:1;e.style.transformOrigin='50% 100%';
    e.style.transform=`translate(${dx}px,${dy+y0*(1-cai)+(p>=1?quique:0)}px) rotate(${q.giro*(1-outCubic(p))+(q.fim||0)*outCubic(p)+(p>=1?4*pancada(t,q.pouso,15,6.5):0)}deg) scaleY(${amassa})`;});
  {const m=M.ar2,e=$('l-ar2');let cx,cy,r,op=t<E2.sai?0:1;const fim=E2.bate+E2.voo;
   if(t<E2.bate){const p=P(t,E2.sai,E2.bate-E2.sai);cx=E2.topo[0];cy=-80+(E2.topo[1]+80)*p*p;r=220*(1-p);}
   else if(t<fim){const s=(t-E2.bate)/E2.voo;cx=E2.topo[0]+(E2.chao[0]-E2.topo[0])*s;                  // arco: sobe um pouco e despenca
     cy=E2.topo[1]+(E2.chao[1]-E2.topo[1])*s-260*4*s*(1-s)*(1-s);r=-300*s;}
   else{const s=t-fim;cx=E2.chao[0]+26*(1-Math.exp(-4*s));cy=E2.chao[1]-70*Math.abs(Math.exp(-4.2*s)*Math.sin(9.5*s));r=-300-40*(1-Math.exp(-3*s));}
   e.style.left=(cx-m.w/2)+'px';e.style.top=(cy-m.h/2)+'px';e.style.opacity=op;e.style.transform=`rotate(${r}deg)`;
   const perto=t<E2.bate?0:clamp(1-(E2.chao[1]-cy)/260);const so=$('sombra');so.style.left=(cx-45)+'px';so.style.top=(E2.chao[1]+m.h/2-10)+'px';so.style.opacity=.9*perto*perto;so.style.transform=`scale(${.5+.5*perto})`;}
  let ang=-TOTAL;QUEDA.forEach(q=>{ang+=q.peso*mola(P(t,q.pouso,.55))});ang+=5*pancada(t,E2.bate,20,5)+.9*Math.sin(t*2.3)*clamp(t-3.9);
  $('pont').style.transform=`rotate(${ang}deg)`;
  const b=P(t,4.2,1.2);$('faixa').style.transform=`translateX(${-360+1560*b}px) rotate(18deg)`;$('faixa').style.opacity=b>0&&b<1?.42:0;
  $('cam').style.transform=`scale(${1.06-.06*outCubic(P(t,0,3.6))})`;
  const c=mola(P(t,.25,.9));$('cartao').style.opacity=clamp(P(t,.25,.15));$('cartao').style.transform=`rotate(${-5-14*(1-c)}deg) scale(${.5+.5*c})`;
  [...$('fecho').querySelectorAll('i')].forEach((l,i)=>{const p=outCubic(P(t,.5+i*.14,.6));l.style.transform=`translateY(${(1-p)*105}%)`;});
  const g=mola(P(t,.1,.8));$('tag').style.opacity=clamp(P(t,.1,.15));$('tag').style.transform=`scale(${.5+.5*g})`;
}
fetch('camadas/quilo/meta.json').then(r=>r.json()).then(async m=>{M=m;
  $('prato').innerHTML=ORDEM.map(k=>{const q=k.startsWith('bal-')?m[k]:casa(m[k],k);const so=COM_SOMBRA.includes(k)?`<div class="sp" id="s-${k}" style="left:${q.x+q.w*.08}px;top:${q.y+q.h-12}px;width:${q.w*.84}px"></div>`:'';return so+`<img id="l-${k}" src="camadas/quilo/${k}.png" style="left:${q.x}px;top:${q.y}px;width:${q.w}px">`}).join('');
  const co=$('corpo');co.style.left=m['bal-corpo'].x+'px';co.style.top=m['bal-corpo'].y+'px';
  const pt=$('pont'),po=m.ponteiro;pt.style.left=(m.balanca.eixo[0]-(po.px-po.x))+'px';pt.style.top=(m.balanca.eixo[1]-(po.py-po.y))+'px';pt.style.transformOrigin=`${po.px-po.x}px ${po.py-po.y}px`;
  await Promise.all([document.fonts.load('400 60px "Instrument Serif"'),document.fonts.load('italic 400 60px "Instrument Serif"'),document.fonts.load('600 40px Poppins'),document.fonts.load('500 40px Poppins'),...[...document.images].map(i=>i.decode().catch(()=>{}))]);
  window.DURATION=DUR;window.render=render;const q=new URLSearchParams(location.search);
  // ?cena=1: só a balança no estúdio, sem palavra nem texto, para os outros slides
  if(q.get('cena')){document.querySelectorAll('#c>.t,#brilho,#l-ar2,#sombra').forEach(e=>e.style.display='none');document.querySelector('img[src$="palavra.png"]').style.display='none';}
  render(parseFloat(q.get('t')||'7'));window.READY=true;
  if(q.get('play')){const s=performance.now();(function l(){render(((performance.now()-s)/1000)%DUR);requestAnimationFrame(l)})();}});
</script>
</body>
</html>
