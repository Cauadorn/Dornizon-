<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>EMS · quilo · capa animada</title>
<style>
@font-face{font-family:"Instrument Serif";src:url(fonts/InstrumentSerif-Regular.ttf);font-style:normal}
@font-face{font-family:"Instrument Serif";src:url(fonts/InstrumentSerif-Italic.ttf);font-style:italic}
@font-face{font-family:"Poppins";src:url(fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:"Poppins";src:url(fonts/Poppins-SemiBold.ttf);font-weight:600}
html,body{margin:0;background:#111}*{box-sizing:border-box}
#c{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:Poppins;color:#fffbde;background:#3d1c46}
#cam{position:absolute;left:0;top:0;width:1080px;height:1350px;transform-origin:50% 52%}
#cena{position:absolute;left:0;top:0;width:1024px;height:1280px;transform-origin:0 0;transform:scale(1.0546875)}
#cena>*{position:absolute}
#cena img{display:block}
#brilho{left:0;top:0;width:1024px;height:1280px;-webkit-mask:url(camadas/quilo/palavra-mask.png) 0 0/1024px 1280px no-repeat;mask:url(camadas/quilo/palavra-mask.png) 0 0/1024px 1280px no-repeat;mix-blend-mode:screen;overflow:hidden}
#faixa{position:absolute;top:600px;left:0;width:340px;height:600px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,240,250,.85) 45%,rgba(255,255,255,.95) 50%,rgba(255,240,250,.85) 55%,rgba(255,255,255,0));transform-origin:50% 50%}
#c>.t{position:absolute}
.tag{left:110px;top:90px;font:500 24px/1 Poppins;padding:.36em .7em .36em .5em;border-radius:5px;color:#fffbde;background:#6225d8;white-space:nowrap;transform-origin:0 100%}
.tag svg{position:absolute;left:-19px;bottom:-21px}
.cartao{left:90px;top:704px;font:600 38px/1.12 Poppins;padding:18px 26px 20px;border-radius:20px;white-space:nowrap;transform-origin:0 100%;box-shadow:7px 8px 0 rgba(42,20,51,.55);background:#fffbde;color:#2a1433}
.fecho{left:90px;top:1132px;font:400 60px/.96 "Instrument Serif";letter-spacing:-.015em;white-space:nowrap}
.fecho em{font-style:italic;color:#f2cf7a}
.fecho span{display:block;overflow:hidden}.fecho span i{display:block;font-style:normal}
</style>
</head>
<body>
<div id="c">
  <div id="cam"><div id="cena">
    <img src="camadas/quilo/fundo.png" style="left:0;top:0">
    <img id="topo" src="camadas/quilo/topo.png" style="left:0;top:0">
    <img id="p1" src="camadas/quilo/peca1.png">
    <img id="p2" src="camadas/quilo/peca2.png">
    <img id="pont" src="camadas/quilo/ponteiro.png">
    <div id="brilho"><div id="faixa"></div></div>
  </div></div>
  <span class="t tag" id="tag">@itsemsdesign<svg width="28" height="28" viewBox="0 0 24 24"><path d="M3 2 L21 10 L12.5 12.5 L9 21 Z" fill="#2a1433" stroke="#fffbde" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
  <span class="t cartao" id="cartao">marca não<br>se vende no</span>
  <span class="t fecho" id="fecho"><span><i>o que entra no <em>prato</em></i></span><span><i>de uma identidade visual.</i></span></span>
</div>
<script>
const FPS=30,DUR=6.5;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,t0,d)=>clamp((t-t0)/d);
const outCubic=p=>1-Math.pow(1-p,3);
const mola=p=>p<=0?0:p>=1?1:1-Math.exp(-6.5*p)*Math.cos(11*p);
// resposta de mola a uma pancada no instante t0: sobe, passa do ponto e morre
const pancada=(t,t0,freq=17,amort=5.5)=>t<t0?0:Math.exp(-amort*(t-t0))*Math.sin(freq*(t-t0));
const $=id=>document.getElementById(id);
let M;
// as duas peças: quando caem, onde pousam (centro, em px da cena), com que giro
const PECAS=[{id:'p1',t0:.75,dur:.5,alvo:[733,196],rot0:-150,rot:32},{id:'p2',t0:1.75,dur:.46,alvo:[606,128],rot0:140,rot:-12}];
const POUSO=PECAS.map(p=>p.t0+p.dur);

function render(t){
  // prato + pilha: afundam a cada pouso
  const dip=10*pancada(t,POUSO[0],16,5)+7*pancada(t,POUSO[1],18,5.5);
  const aperto=1-.012*Math.max(0,pancada(t,POUSO[0],16,5))-.008*Math.max(0,pancada(t,POUSO[1],18,5.5));
  $('topo').style.transformOrigin=`512px ${M.corte}px`;
  $('topo').style.transform=`translateY(${dip}px) scaleY(${aperto})`;
  // peças: queda livre (acelera), pouso com quique, depois acompanham o prato
  PECAS.forEach((p,i)=>{const m=M['peca'+(i+1)],e=$(p.id),q=P(t,p.t0,p.dur),cai=q*q;
    const x=p.alvo[0]-m.w/2,y0=-m.h-80,y1=p.alvo[1]-m.h/2;
    const quique=-16*Math.abs(pancada(t,POUSO[i],13,7));
    e.style.left=x+'px';e.style.top='0px';e.style.opacity=t<p.t0?0:1;
    e.style.transform=`translateY(${y0+(y1-y0)*cai+(q>=1?quique+dip:0)}px) rotate(${p.rot0+(p.rot-p.rot0)*outCubic(q)+(q>=1?6*pancada(t,POUSO[i],15,6):0)}deg)`;});
  // ponteiro: começa mais leve e pula a cada peça; termina igual à arte parada
  const ang=-17+8*mola(P(t,POUSO[0],.9))+9*mola(P(t,POUSO[1],.9))+1.2*Math.sin(t*2.2)*clamp(t-3);
  const pt=$('pont');pt.style.left=M.ponteiro.x+'px';pt.style.top=M.ponteiro.y+'px';
  pt.style.transformOrigin=`${M.ponteiro.px-M.ponteiro.x}px ${M.ponteiro.py-M.ponteiro.y}px`;pt.style.transform=`rotate(${ang}deg)`;
  // brilho que atravessa a palavra
  const b=P(t,2.7,1.3);$('faixa').style.transform=`translateX(${-320+1500*b}px) rotate(18deg)`;$('faixa').style.opacity=b>0&&b<1?.42:0;
  // câmera chega devagar
  $('cam').style.transform=`scale(${1+.035*outCubic(P(t,0,DUR))})`;
  // textos
  const c=mola(P(t,.25,.9));$('cartao').style.opacity=clamp(P(t,.25,.15));$('cartao').style.transform=`rotate(${-5-14*(1-c)}deg) scale(${.5+.5*c})`;
  [...$('fecho').querySelectorAll('i')].forEach((l,i)=>{const p=outCubic(P(t,.5+i*.14,.6));l.style.transform=`translateY(${(1-p)*105}%)`;});
  const g=mola(P(t,.1,.8));$('tag').style.opacity=clamp(P(t,.1,.15));$('tag').style.transform=`scale(${.5+.5*g})`;
}
fetch('camadas/quilo/meta.json').then(r=>r.json()).then(async m=>{M=m;
  await Promise.all([document.fonts.load('400 60px "Instrument Serif"'),document.fonts.load('italic 400 60px "Instrument Serif"'),document.fonts.load('600 40px Poppins'),document.fonts.load('500 40px Poppins'),...[...document.images].map(i=>i.decode().catch(()=>{}))]);
  window.DURATION=DUR;window.render=render;const q=new URLSearchParams(location.search);render(parseFloat(q.get('t')||'6'));window.READY=true;
  if(q.get('play')){const s=performance.now();(function l(){render(((performance.now()-s)/1000)%DUR);requestAnimationFrame(l)})();}});
</script>
</body>
</html>
