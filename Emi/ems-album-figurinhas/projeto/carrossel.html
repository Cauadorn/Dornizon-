<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>EMS · figurinhas raras</title>
<link rel="stylesheet" href="estilo.css">
<script src="textos.js"></script>
<style>
  /* v4: diagramação das referências da Emi (pinterest-emi/), sem foto; fundos só violeta ou marfim */
  .g { position: absolute; font-family: var(--serif); font-weight: 400; letter-spacing: -.035em; line-height: .78; white-space: nowrap; }
  .g.i { font-style: italic; letter-spacing: -.02em; }
  .pilula-ref { display: table; font-family: var(--sans); font-weight: 600; line-height: 1; letter-spacing: -.02em; padding: .12em .32em .16em; border-radius: .26em; }
  .micro { position: absolute; font-family: var(--sans); font-size: 17px; line-height: 1.05; text-align: justify; text-align-last: justify; }
  .barra { position: absolute; display: flex; gap: 26px; align-items: center; padding: 30px 190px 30px 34px; border-radius: 26px 0 0 26px; }
  .barra .fio { width: 4px; align-self: stretch; border-radius: 2px; }
  .barra .nome { font-family: var(--serif); font-size: 64px; line-height: .9; letter-spacing: -.02em; display: block; }
  .barra .pra { font-family: var(--sans); font-size: 26px; line-height: 1.25; display: block; margin-top: 8px; }
  .hora { position: absolute; left: 90px; font-family: var(--sans); font-size: 21px; color: rgba(42,20,51,.45); }
</style>
</head>
<body>
<div class="faixa" id="faixa">
  <div class="camada" id="fundos"></div>
  <div class="camada" id="conteudos"></div>
  <div class="camada" id="ponte-frente"></div>
  <div class="camada" id="graos"></div>
</div>
<script>
const W = 1080, H = 1350;
const params = new URLSearchParams(location.search);
const N = +(params.get('n') || 7);
document.getElementById('faixa').style.width = (N * W) + 'px';
document.body.style.width = (N * W) + 'px';
const css = (k) => getComputedStyle(document.documentElement).getPropertyValue('--' + k).trim();
const A = window.ALBUM;
function ruido(tam, freq, oct, seed) {
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${tam}' height='${tam}'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='${freq}' numOctaves='${oct}' seed='${seed}' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>`;
  return `url("data:image/svg+xml;utf8,${svg}")`;
}
document.documentElement.style.setProperty('--tx-grao', ruido(300, 0.95, 3, 11));
document.documentElement.style.setProperty('--tx-papel', ruido(520, '0.012 0.35', 4, 5));
const relevo = (tam, freq, oct, seed, alt) => `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='${tam}' height='${tam}'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='${freq}' numOctaves='${oct}' seed='${seed}' stitchTiles='stitch'/><feDiffuseLighting lighting-color='white' surfaceScale='${alt}'><feDistantLight azimuth='225' elevation='55'/></feDiffuseLighting></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>")`;
document.documentElement.style.setProperty('--tx-relevo', relevo(700, 0.035, 5, 3, 2.2));
document.documentElement.style.setProperty('--tx-fibras', relevo(500, '0.6 0.05', 2, 8, 1.2));

/* estrela da marca (i-estrela, chapada, com brilho) no lugar do emoji de estrela das refs */
const ESTRELA = 'M0,-1 L0.24,-0.33 L0.95,-0.31 L0.39,0.13 L0.59,0.81 L0,0.41 L-0.59,0.81 L-0.39,0.13 L-0.95,-0.31 L-0.24,-0.33Z';
const estrela = ({ x, y, tam, r = 0 }) => `<svg class="abs" style="left:${x}px;top:${y}px;width:${tam}px;height:${tam}px;transform:rotate(${r}deg);filter:drop-shadow(2px 4px 3px rgba(42,20,51,.3))" viewBox="-1.1 -1.1 2.2 2.2">
  <defs><radialGradient id="ge${x}${y}" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#fff6c9"/><stop offset=".55" stop-color="${css('manteiga')}"/><stop offset="1" stop-color="#d9a94a"/></radialGradient></defs>
  <path d="${ESTRELA}" fill="url(#ge${x}${y})" stroke="#c99a3e" stroke-width=".05" stroke-linejoin="round"/></svg>`;
const CURSOR = `<svg viewBox="0 0 24 24"><path d="M3 2 L20 11 L12 13 L8 21 Z" fill="${css('tinta')}" stroke="${css('ivory')}" stroke-width="2" stroke-linejoin="round"/></svg>`;
const cursor = (x, y, tam = 54) => `<svg class="abs" style="left:${x}px;top:${y}px;width:${tam}px;filter:drop-shadow(1px 2px 1px rgba(42,20,51,.3))" viewBox="0 0 24 24"><path d="M3 2 L3 19 L8 14.5 L11.5 22 L14.5 20.6 L11 13.4 L17.6 13.2 Z" fill="${css('ivory')}" stroke="${css('tinta')}" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
const handle = (x, y, bg = 'var(--pink)') => `<div class="handle" style="left:${x}px;top:${y}px;--bg:${bg}">@itsemsdesign${CURSOR}</div>`;
const objeto = ({ x, y, w, r = 0, src }) => `<img class="objeto" src="recortes/${src}.png" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(${r}deg)">`;
const pasta = (x, y, w, r, cor) => `<svg class="abs" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(${r}deg);filter:drop-shadow(0 10px 12px rgba(42,20,51,.25))" viewBox="0 0 130 100">
  <path d="M8 14 Q8 6 16 6 H50 Q56 6 59 12 L63 18 H116 Q124 18 124 26 V88 Q124 96 116 96 H16 Q8 96 8 88 Z" fill="${cor}"/>
  <path d="M8 32 Q8 26 14 26 H118 Q124 26 124 32 V88 Q124 96 116 96 H16 Q8 96 8 88 Z" fill="${cor}" opacity=".88"/>
  <path d="M8 32 Q8 26 14 26 H118 Q124 26 124 32 V36 H8Z" fill="#fff" opacity=".12"/></svg>`;

const camada = (id) => document.getElementById(id);
function lamina(k, html, fundo, grao = 'grao') {
  if (k >= N) return;
  camada('fundos').insertAdjacentHTML('beforeend', `<div class="lamina" style="left:${k * W}px">${fundo}</div>`);
  camada('conteudos').insertAdjacentHTML('beforeend', `<div class="lamina" id="l${k}" style="left:${k * W}px">${html}</div>`);
  camada('graos').insertAdjacentHTML('beforeend', `<div class="lamina" style="left:${k * W}px"><div class="${grao}"></div>${params.has('guia') ? '<div class="guia"></div>' : ''}</div>`);
}

/* ================= 1 · capa — diagramação da ref 3 (@delfy) ================= */
(() => {
  const micro = (x, y, w, cor) => `<div class="micro" style="left:${x}px;top:${y}px;width:${w}px;color:${cor}" data-sem-cola>10 sites que salvam meu processo e quase ninguém tem no álbum. 10 sites que salvam meu processo e quase ninguém tem no álbum.</div>`;
  lamina(0, `
    ${micro(90, 96, 220, 'rgba(255,251,222,.5)')}
    ${micro(90, 980, 220, 'rgba(255,251,222,.5)')}
    <div class="abs" style="left:0;right:0;top:170px;display:flex;flex-direction:column;align-items:center;gap:6px">
      <span class="pilula-ref" style="font-size:64px;background:var(--ivory);color:var(--violeta)">10 sites no</span>
      <span class="pilula-ref" style="font-size:64px;background:var(--ivory);color:var(--violeta)">pacotinho das</span></div>
    ${estrela({ x: 772, y: 232, tam: 92, r: 12 })}
    <div class="g" id="capa-g1" style="left:90px;width:900px;top:330px;text-align:center;font-size:310px;color:var(--manteiga)">figurinhas</div>
    ${objeto({ x: 470, y: 520, w: 540, r: -7, src: 'pacotinho' })}
    <div class="g i" style="left:110px;top:640px;font-size:360px;color:var(--ivory)">raras</div>
    <div class="abs" style="left:0;right:0;top:1112px;text-align:center">
      <img src="assets/selo-ems.png" style="width:74px;vertical-align:middle;margin-right:14px">
      <span style="font-family:var(--sans);font-weight:500;font-size:26px;color:var(--ivory);vertical-align:middle">sites de designer que ninguém te conta</span></div>
    <div class="handle" style="left:96px;top:1212px;--bg:var(--pink)">@itsemsdesign${CURSOR}</div>
  `, `<div class="abs" style="inset:0;background:var(--violeta)"></div>
      <div class="abs" style="inset:0;background:radial-gradient(ellipse at 50% 55%, rgba(123,77,242,.6), transparent 72%)"></div>`, 'grao-luz');
})();

/* ================= 2 · pesquisa — diagramação da ref 8 (agenda) ================= */
const PAUTA0 = 150, PASSO = 108;
const FOLHA = `<div class="abs" style="inset:0;background:var(--ivory-2)"></div>
      <div class="abs" style="inset:0;background-image:var(--tx-relevo);background-size:700px;mix-blend-mode:multiply;opacity:.32"></div>
      <div class="abs" style="inset:0;background-image:var(--tx-fibras);background-size:500px;mix-blend-mode:multiply;opacity:.22"></div>
      <div class="abs" style="left:176px;top:0;bottom:0;width:2px;background:rgba(91,33,108,.28)"></div>
      <div class="abs" style="inset:0;background:repeating-linear-gradient(to bottom, rgba(91,33,108,.24) 0 2px, transparent 2px ${PASSO}px);background-position:0 ${PAUTA0}px"></div>
      <div class="abs" style="inset:0;background:radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(91,33,108,.10))"></div>`;
(() => {
  const p = A.paginas[0], [s1, s2] = p.sites;
  const horas = ['9h', '10h', '11h', '12h', '13h', '14h', '15h', '16h', '17h', '18h', '19h'];
  const linhas = horas.map((h, i) => `<div class="hora" style="top:${PAUTA0 + PASSO * i - 13}px">${h}</div>`).join('');
  lamina(1, `
    <div class="abs" style="left:0;right:0;top:92px;text-align:center;font-family:var(--sans);font-size:24px;color:var(--tinta)">itsemsdesign <b style="font-weight:600">| álbum de figurinhas</b></div>
    ${linhas}
    ${pasta(206, 330, 150, -6, css('violeta'))}
    ${cursor(316, 398, 52)}
    <div class="abs" style="right:90px;top:404px;text-align:left;font-family:var(--sans);font-weight:500;font-size:46px;line-height:1.02;color:var(--tinta);letter-spacing:-.015em">pra achar referência<br>sem depender do</div>
    <div class="g" id="alg" style="left:196px;top:548px;font-size:236px;color:var(--violeta)">algoritmo</div>
    ${estrela({ x: 920, y: 520, tam: 84, r: 14 })}
    ${estrela({ x: 186, y: 740, tam: 70, r: -10 })}
    <div class="barra" style="left:360px;right:0;top:850px;background:var(--lavanda-2)">
      <div class="fio" style="background:var(--violeta)"></div>
      <div><span class="nome" style="color:var(--violeta)">${s1.nome}</span><span class="pra" style="color:var(--tinta)">${s1.pra}</span></div></div>
    <div class="barra" style="left:250px;right:0;top:1058px;background:var(--lavanda)">
      <div class="fio" style="background:var(--tinta)"></div>
      <div><span class="nome" style="color:var(--tinta)">${s2.nome}</span><span class="pra" style="color:var(--tinta)">${s2.pra}</span></div></div>
    ${pasta(880, 1118, 140, 8, css('violeta'))}
    ${cursor(974, 1182, 50)}
    <img class="objeto" id="lupa" src="recortes/lupa.png" style="left:0;top:0;width:470px">
    <div class="abs" id="lente" style="inset:0"><div class="abs" id="lente-in" style="inset:0">${FOLHA}</div>
      <div class="abs" id="brilho-lente" style="inset:0"></div></div>
  `, FOLHA);
})();

/* lupa de acrílico em cima de "algoritmo", ampliando a palavra (posição medida depois das fontes) */

function caber(el, largura) { let s = parseFloat(getComputedStyle(el).fontSize); while (el.scrollWidth > largura && s > 20) { s -= 2; el.style.fontSize = s + 'px'; } }
document.fonts.ready.then(() => {
  const a = document.getElementById('alg'); if (a) caber(a, 800);
  const lam = document.getElementById('l1');
  if (a && lam) {
    const r = a.getBoundingClientRect(), b = lam.getBoundingClientRect();
    const lw = 470, k = lw / 738, cx = r.left - b.left + r.width * .56, cy = r.top - b.top + r.height * .6, rl = 186 * k;
    const lupa = document.getElementById('lupa'); lupa.style.left = (cx - 233 * k) + 'px'; lupa.style.top = (cy - 227 * k) + 'px';
    const lente = document.getElementById('lente'), dentro = document.getElementById('lente-in');
    lente.style.clipPath = `circle(${rl}px at ${cx}px ${cy}px)`;
    dentro.appendChild(a.cloneNode(true)).removeAttribute('id');
    dentro.style.transformOrigin = `${cx}px ${cy}px`; dentro.style.transform = 'scale(1.42)';
    document.getElementById('brilho-lente').style.background =
      `radial-gradient(circle at ${cx - rl * .35}px ${cy - rl * .4}px, rgba(255,255,255,.5), rgba(255,255,255,0) ${rl * .55}px),
       radial-gradient(circle at ${cx}px ${cy}px, transparent ${rl * .78}px, rgba(91,33,108,.18) ${rl}px)`;
  } const g1 = document.getElementById('capa-g1'); if (g1) caber(g1, 900);
  return Promise.all([...document.images].map((im) => im.complete ? 1 : new Promise((r) => { im.onload = im.onerror = r; })));
}).then(() => { window.READY = true; });
</script>
<script src="scripts/palavra-curta.js"></script>
</body>
</html>
