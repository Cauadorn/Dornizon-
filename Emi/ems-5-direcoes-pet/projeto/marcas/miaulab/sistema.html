<!doctype html>
<!-- MIAU.LAB · sistema sofisticado (pedido da Emi: "sofisticar ela e trabalhar melhor pra postar assim", com o post da Melt/Ayeida
     de referência: referencias/miaulab/post-melt-ayeida). Do post vem a IDEIA, não a estrutura:
     - um nome forte que vira grafismo gigante nas embalagens (aqui o MIAU condensado com o gato no U, já aprovado);
     - uma letra de apoio limpa e pequena (Instrument Sans) e uma palavra em script de acento (Mea Culpa);
     - selo em pílula, linha de microtexto em três colunas, paleta curta de 2 cores fortes + 1 neutra quente;
     - o grafismo próprio da MIAU.LAB: os arranhõezinhos do gato (das unhas do logo) sublinham a palavra em script.
     ?parte=principal|negativo|frase|selo|paleta|letras · ?w=&h= -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Archivo; src: url(../../fonts/Archivo-var-latin.woff2); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: Mono; src: url(../../fonts/SpaceMono-normal-700.woff2); font-weight: 700; }
@font-face { font-family: IS; src: url(../../fonts/InstrumentSans-var.woff2); font-weight: 400 700; }
@font-face { font-family: Mea; src: url(../../fonts/MeaCulpa.woff2); }
:root { --cobalto: #2B3FD1; --rosa: #F4B9CD; --creme: #F6EEDC; --manteiga: #F2DC8B; --nanquim: #1C1A24; }
html, body { margin: 0; }
.p { position: relative; overflow: hidden; }
.logo { position: absolute; width: 899px; height: 700px; transform-origin: 0 0; }
.lab { position: absolute; font: 400 150px/1 Mea; }
.micro { position: absolute; left: 64px; right: 64px; display: flex; justify-content: space-between; font: 500 30px/1 IS; letter-spacing: .005em; }
.micro i { font: 400 56px/0 Mea; font-style: normal; position: relative; top: 4px; }
.pilula { position: absolute; left: 50%; transform: translateX(-50%); border: 2px solid currentColor; border-radius: 999px; padding: 16px 44px 15px; font: 500 26px/1 IS; letter-spacing: .16em; white-space: nowrap; }
.frase { position: absolute; left: 0; right: 0; text-align: center; font: 500 132px/1 IS; letter-spacing: -.035em; }
.frase .s { font: 400 300px/.9 Mea; letter-spacing: 0; position: relative; display:inline-block; margin-top: -10px; }
svg.risco { position: absolute; overflow: visible; }
</style><script src="gato-v3/gato.js"></script><script src="logo.js"></script></head><body>
<div class="p" id="p"></div>
<script>
const q = new URLSearchParams(location.search), parte = q.get('parte') || 'principal';
const W = +(q.get('w') || 1440), H = +(q.get('h') || 1800), p = document.getElementById('p');
p.style.width = W + 'px'; p.style.height = H + 'px';
const C = { cobalto: '#2B3FD1', rosa: '#F4B9CD', creme: '#F6EEDC', manteiga: '#F2DC8B', nanquim: '#1C1A24' };
// arranhõezinhos (o grafismo da marca): três traços finos e afinados, como as unhas do logo
const riscos = (x, y, larg, cor) => { let s = `<svg class="risco" style="left:${x}px;top:${y}px" width="${larg}" height="40" viewBox="0 0 ${larg} 40">`;
  [[0.04, 0.9, 6, 3.2], [0.06, 0.96, 18, 3.6], [0.1, 0.84, 30, 2.8]].forEach(([a, b, yy, w]) => {
    const x0 = larg * a, x1 = larg * b, m = (x0 + x1) / 2;
    s += `<path d="M${x0} ${yy} Q${m} ${yy - 5 + w} ${x1} ${yy + 2} Q${m} ${yy - 5 + w + w * .9} ${x0} ${yy} Z" fill="${cor}"/>`; });
  return s + '</svg>'; };
const V3 = q.get('v') !== '2';   // ?v=2 mostra o gato antigo, para comparar
function logo(x, y, k, o) {
  const d = document.createElement('div'); d.className = 'logo'; d.style.cssText = `left:${x}px;top:${y}px;transform:scale(${k})`; p.appendChild(d);
  const extra = {}; ['s3', 'sp3', 'rasgo', 'rastroW', 'rastroK', 'olhoGiro', 'olhoDx', 'olhoDy', 'olhoK', 'giro3', 'fio3', 'corteUnha', 'patasDx'].forEach(c => { if (q.get(c)) extra[c] = +q.get(c); });
  if (q.get('forma')) extra.forma = q.get('forma');
  (V3 ? miauLogoV3 : miauLogo)(d, { ...o, ...extra }); return d;
}
// tudo junto (a Emi: "mania de deixar as coisas espaçadas… parece que tá tudo flutuando"): cada peça é UM bloco compacto,
// com o texto pequeno encaixado no logo (como o "Freshly baked. Worth melting for." no copo da Melt) e a frase com as linhas
// quase encostando, medidas pela tinta das letras (measureText), não pela caixa da fonte.
const cv = document.createElement('canvas').getContext('2d');
const tinta = (txt, font, ls = 0) => { cv.font = font; cv.letterSpacing = ls + 'px'; const m = cv.measureText(txt);
  return { asc: m.actualBoundingBoxAscent, desc: m.actualBoundingBoxDescent, l: m.actualBoundingBoxLeft, r: m.actualBoundingBoxRight, w: m.width }; };
const txt = (html, css) => p.insertAdjacentHTML('beforeend', `<div style="position:absolute;white-space:nowrap;${css}">${html}</div>`);
Promise.all(['500 100px IS', '600 100px IS', '400 100px Mea', '900 100px Archivo', '700 64px Mono'].map(f => document.fonts.load(f))).then(() => {
if (['principal', 'negativo', 'rosa'].includes(parte)) {
  const V = { principal: [C.creme, C.cobalto, C.nanquim, C.creme], negativo: [C.cobalto, C.creme, C.rosa, C.nanquim], rosa: [C.rosa, C.cobalto, C.nanquim, C.rosa] }[parte];
  const [bg, cor, labFundo, labCor] = V;
  p.style.background = bg;
  // bloco: do topo da cabeça do gato (y≈141) à base da etiqueta .lab (y=700), nome de 0 a 899
  const k = W * .74 / 899, x0 = (W - 899 * k) / 2, y0 = H / 2 - (141 + 700) / 2 * k;
  const d = logo(x0, y0, k, { cor, fundo: bg, gato: C.nanquim, olho: parte === 'rosa' ? C.manteiga : C.rosa, labFundo, labCor });
  // duas linhas encaixadas sob o M-I, na altura da etiqueta: topo das maiúsculas = topo da etiqueta, base = base da etiqueta
  // topo das maiúsculas = topo da etiqueta (610); base da 2ª linha = base da etiqueta (700); entrelinha justa
  const f = 52, fonte = `500 ${f}px IS`; cv.font = fonte; const mm = cv.measureText('F'), cap = mm.actualBoundingBoxAscent;
  const lh = 700 - 610 - cap, base1 = 610 + cap, top = base1 - (lh - (mm.fontBoundingBoxAscent + mm.fontBoundingBoxDescent)) / 2 - mm.fontBoundingBoxAscent;
  d.insertAdjacentHTML('beforeend', `<div style="position:absolute;left:-1px;top:${top}px;font:${fonte};line-height:${lh}px;letter-spacing:-.015em;color:${cor}">Fórmula veterinária.<br>Feita pra gatos.</div>`);
} else if (parte === 'frase') {
  p.style.background = C.rosa;
  const f1 = 168, F1 = `500 ${f1}px IS`, ls1 = -.04 * f1, l1 = 'Ciência que', m1 = tinta(l1, F1, ls1);
  const f2 = 330, F2 = `400 ${f2}px Mea`, l2 = 'ronrona.', m2 = tinta(l2, F2), mx = tinta('o', F2);
  // folga medida tinta a tinta: do pé do ç/q da linha 1 ao ponto mais alto da script (as voltas do r sobem acima do x)
  const vao = +(q.get('vao') || 16);
  const alt = m1.asc + m1.desc + vao + m2.asc + m2.desc, topo = H / 2 - alt / 2 - 40;
  const b1 = topo + m1.asc, b2 = b1 + m1.desc + vao + m2.asc;   // linhas de base
  // centralizado pela TINTA de cada linha (antes o "ronrona" vinha recuado e o bloco pendia 70 px para a direita)
  const xA = W / 2 - (m1.r - m1.l) / 2 + (+(q.get('ax') || 0)), xB = W / 2 - (m2.r - m2.l) / 2 + (+(q.get('bx') || 0));
  txt(l1, `left:${xA}px;top:${b1 - f1 * .5}px;font:${F1};line-height:${f1}px;height:0;letter-spacing:${ls1}px;color:${C.cobalto};display:flex;align-items:center`);
  txt(l2, `left:${xB}px;top:${b2 - f2 * .5}px;font:${F2};line-height:${f2}px;height:0;color:${C.cobalto};display:flex;align-items:center`);
  // corrige pela linha de base real (o centro da caixa de linha fica a (asc-desc)/2 da base)
  document.querySelectorAll('#p > div').forEach((el, i) => { const fs = i ? f2 : f1, F = i ? F2 : F1; cv.font = F; const m = cv.measureText('x');
    const base = i ? b2 : b1; el.style.top = (base - (m.fontBoundingBoxAscent - m.fontBoundingBoxDescent) / 2) + 'px'; });
  if (q.get('so')) document.querySelectorAll('#p > div').forEach((el, i) => { if (i + 1 != q.get('so')) el.style.color = 'transparent'; });
  // selo pequeno logo abaixo, encostado no bloco
  txt('FEITO PRA GATOS', `left:50%;top:${b2 + m2.desc + 40}px;transform:translateX(-50%);border:2.5px solid ${C.cobalto};border-radius:99px;padding:15px 34px 14px;font:500 28px/1 IS;letter-spacing:.08em;color:${C.cobalto}`);
} else if (parte === 'selo') {
  p.style.background = C.manteiga;
  const f = 150, F = `600 ${f}px IS`, t = 'MIAU.LAB Nº07', m = tinta(t, F, f * -.01), cap = tinta('M', F).asc;
  const ch = cap * 2.1, cw = m.w + ch * .9, cx = W / 2, top = H / 2 - ch / 2 + 90;
  p.insertAdjacentHTML('beforeend', `<div style="position:absolute;left:${cx - cw / 2}px;top:${top}px;width:${cw}px;height:${ch}px;border-radius:${ch}px;background:${C.cobalto};color:${C.creme};display:flex;align-items:center;justify-content:center;font:${F};letter-spacing:${f * -.01}px;padding-top:8px;box-sizing:border-box">${t}</div>`);
  const k = cw * .5 / 899; logo(cx - 798 * k, top - 260 * k, k, { cor: 'transparent', fundo: C.cobalto, gato: C.nanquim, olho: C.rosa, unhas: false, lab: false });
}
});
</script></body></html>
