<!doctype html>
<!-- Capa do reel do case MIAU.LAB no perfil @itsemsdesign (v4: receita veterinária).
     v1 cartão colado, v2 foto do gato preto, v3 (mesma fórmula da capa das direções pet) reprovadas: "não quero que você copie".
     A Emi deixou o conceito comigo ("se vira, menos o antes e depois"). Ideia nova, no padrão aprovado da EMS de
     "chamada como objeto com piada": a capa é uma RECEITA da "clínica de marcas" da EMS para a paciente MIAU.LAB
     (que é fórmula veterinária), e o gatinho desenhado da marca espia por cima do bloco, arranhando o papel.
     Fundo ameixa com xadrez tom sobre tom + grão; Instrument Serif com UMA palavra em itálico; Poppins; selo original.
     1080x1920, conteúdo no miolo 3:4 (y 240–1680). -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Serif; src: url(../../../../fonts/InstrumentSerif-Regular.ttf); }
@font-face { font-family: Serif; src: url(../../../../fonts/InstrumentSerif-Italic.ttf); font-style: italic; }
@font-face { font-family: Poppins; src: url(../../../../fonts/Poppins-Regular.ttf); font-weight: 400; }
@font-face { font-family: Poppins; src: url(../../../../fonts/Poppins-Medium.ttf); font-weight: 500; }
@font-face { font-family: Poppins; src: url(../../../../fonts/Poppins-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: Archivo; src: url(../../../../fonts/Archivo-var-latin.woff2); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: Mono; src: url(../../../../fonts/SpaceMono-normal-700.woff2); font-weight: 700; }
:root { --ameixa: #3d1c46; --plum: #5b216c; --ivory: #fffbde; --tinta: #2a1433; --pink: #dd34a8; --violeta: #6225d8; --wine: #9e122c; --lavanda: #c0a5c4;
        --cobalto: #2B3FD1; --rosa: #F4B9CD; --creme: #F6EEDC; }
html, body { margin: 0; }
#p { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ameixa); }
canvas { position: absolute; left: 0; top: 0; }
.lead { position: absolute; left: 0; right: 0; top: 262px; text-align: center; font: 500 40px/1.1 Poppins; color: var(--ivory); }
#folha { position: absolute; left: 130px; top: 610px; width: 820px; height: 1050px; background: var(--ivory); transform: rotate(-3deg); transform-origin: 50% 0;
  box-shadow: 0 12px 30px rgba(42,20,51,.45); }
#folha .cab { position: absolute; left: 56px; right: 56px; top: 118px; display: flex; justify-content: space-between; align-items: center; padding-bottom: 22px; border-bottom: 2px solid var(--tinta); }
#folha .cab b { font: 600 26px/1.1 Poppins; color: var(--tinta); letter-spacing: .02em; }
#folha .cab span { font: 400 20px/1.25 Poppins; color: var(--wine); text-align: right; }
#folha .pac { position: absolute; left: 56px; right: 56px; top: 236px; font: 400 26px/1.3 Poppins; color: var(--tinta); display: flex; justify-content: space-between; }
#folha .pac em { font-style: normal; font-weight: 600; }
#folha .rx { position: absolute; left: 50px; top: 292px; font: 400 150px/1 Serif; color: var(--wine); }
#folha .tit { position: absolute; left: 56px; top: 448px; font: 400 116px/.9 Serif; letter-spacing: -.02em; color: var(--tinta); }
#folha .tit i { color: var(--pink); }
#folha ul { position: absolute; left: 56px; right: 56px; top: 688px; margin: 0; padding: 0; list-style: none; display: grid; gap: 18px; }
#folha li { font: 400 27px/1.3 Poppins; color: var(--tinta); display: grid; grid-template-columns: 150px 1fr; }
#folha li b { font-weight: 600; color: var(--wine); }
#folha .ass { position: absolute; left: 56px; bottom: 60px; font: 500 24px/1.3 Poppins; color: var(--tinta); }
#folha .ass::before { content: ""; display: block; width: 330px; border-top: 2px solid var(--tinta); margin-bottom: 12px; }
#folha .selo { position: absolute; right: 52px; bottom: 44px; width: 150px; }
.logo { position: absolute; width: 899px; height: 700px; transform-origin: 0 0; }
.play { position: absolute; left: 0; right: 0; top: 1730px; text-align: center; font: 500 30px/1 Poppins; color: var(--ivory); opacity: .9; }
</style><script src="../../gato-v3/gato.js"></script><script src="../../logo.js"></script></head><body><div id="p">
  <canvas id="xadrez" width="1080" height="1920"></canvas>
  <div id="folha">
    <div class="cab"><b>ems design · clínica de marcas</b><span>receituário<br>nov · 2026</span></div>
    <div class="pac"><span>paciente: <em>miau.lab</em></span><span>espécie: marca pet</span></div>
    <div class="rx">Rx</div>
    <div class="tit">uma marca<br>que <i>ronrona.</i></div>
    <ul>
      <li><b>tomar</b><span>1 logo com gato espiando</span></li>
      <li><b>aplicar</b><span>em pouch, pote e caixinha</span></li>
      <li><b>efeito</b><span>ninguém passa reto no feed</span></li>
    </ul>
    <div class="ass">@itsemsdesign</div>
    <img class="selo" src="../../../../img/selo-ems.png" alt="">
  </div>
  <div class="play">↳ dá o play</div>
  <canvas id="grao" width="1080" height="1920"></canvas>
</div>
<script>
// xadrez tom sobre tom (textura da paleta da EMS) no ameixa
{ const c = document.getElementById('xadrez').getContext('2d'), q = 72; c.fillStyle = '#4a2355';
  for (let y = 0; y < 1920; y += q) for (let x = 0; x < 1080; x += q) if (((x + y) / q) % 2 === 0) c.fillRect(x, y, q, q); }
{ const c = document.getElementById('grao').getContext('2d'), im = c.createImageData(1080, 1920);
  for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 18; }
  c.putImageData(im, 0, 0); }
Promise.all(['400 100px Serif', 'italic 400 100px Serif', '400 40px Poppins', '500 40px Poppins', '600 40px Poppins', '900 100px Archivo'].map(f => document.fonts.load(f))).then(() => {
  // o gatinho da MIAU.LAB espiando por cima do bloco (patas na borda de cima da folha, arranhões rasgando o papel)
  const folha = document.getElementById('folha'), k = 2.5, d = document.createElement('div'); d.className = 'logo';
  d.style.cssText = `left:${560 - 798 * k}px;top:${0 - 260 * k}px;transform:scale(${k})`;
  folha.appendChild(d);
  miauLogoV3(d, { cor: 'transparent', fundo: '#3d1c46', gato: '#1C1A24', olho: '#F4B9CD', lab: false, rastroK: .75 });
  document.body.dataset.pronto = 1;
});
</script></body></html>
