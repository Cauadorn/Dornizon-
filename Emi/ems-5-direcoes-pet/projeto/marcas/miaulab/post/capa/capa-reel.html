<!doctype html>
<!-- Capa do reel do case MIAU.LAB no perfil @itsemsdesign (v2). A v1 (cartão do logo colado no ameixa) foi reprovada:
     "que capa horrorosa". Agora no jeito das capas aprovadas da EMS: a foto é a cena inteira (o gato preto da MIAU.LAB
     no amarelo, que é o manteiga das duas marcas), a palavra gigante em Instrument Serif com UMA letra em itálico
     (mi*a*u) passa por TRÁS das orelhas do gato, chamada em Poppins, adesivo redondo rosa e a etiqueta @.
     1080x1920; o que importa fica no miolo 3:4 (y 240–1680) para o grid. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Serif; src: url(../../../../fonts/InstrumentSerif-Regular.ttf); }
@font-face { font-family: Serif; src: url(../../../../fonts/InstrumentSerif-Italic.ttf); font-style: italic; }
@font-face { font-family: Poppins; src: url(../../../../fonts/Poppins-Medium.ttf); font-weight: 500; }
@font-face { font-family: Poppins; src: url(../../../../fonts/Poppins-SemiBold.ttf); font-weight: 600; }
:root { --violeta: #6225d8; --ivory: #fffbde; --tinta: #2a1433; --pink: #dd34a8; }
html, body { margin: 0; }
#p { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #f2d98c; }
#p > img, canvas { position: absolute; left: 0; top: 0; }
.lead { position: absolute; left: 0; right: 0; top: 262px; text-align: center; font: 500 46px/1.1 Poppins; color: var(--tinta); }
.palavra { position: absolute; left: 0; right: 0; top: 268px; text-align: center; font: 400 470px/1 Serif; letter-spacing: -.035em; color: var(--violeta); }
.palavra i { letter-spacing: -.02em; }
.adesivo { position: absolute; left: 96px; top: 1330px; width: 250px; height: 250px; border-radius: 50%; background: var(--pink); color: var(--ivory);
  display: grid; place-items: center; text-align: center; font: 600 34px/1.05 Poppins; transform: rotate(-12deg); box-shadow: 6px 8px 0 rgba(42,20,51,.35); }
.tag { position: absolute; right: 90px; top: 1590px; background: var(--violeta); color: var(--ivory); font: 500 30px/1 Poppins; padding: 14px 20px 13px; border-radius: 4px; }
</style></head><body><div id="p">
  <img src="fundo-gato.jpg" width="1080" height="1920" alt="">
  <div class="lead">do rascunho ao</div>
  <div class="palavra">mi<i>a</i>u.</div>
  <img src="gato-recorte.png" width="1080" height="1920" alt="">
  <div class="adesivo"><div>case<br>novo:<br><span style="font-size:31px">miau.lab</span></div></div>
  <div class="tag">@itsemsdesign</div>
  <canvas id="grao" width="1080" height="1920"></canvas>
</div>
<script>
{ const c = document.getElementById('grao').getContext('2d'), im = c.createImageData(1080, 1920);
  for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 16; }
  c.putImageData(im, 0, 0); }
document.fonts.ready.then(() => document.body.dataset.pronto = 1);
</script></body></html>
