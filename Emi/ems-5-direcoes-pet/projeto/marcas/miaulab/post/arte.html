<!doctype html>
<!-- MIAU.LAB · arte plana das embalagens (vai para o mockup por homografia em aplica-mockup.py).
     Fundo branco: tudo vira tinta por multiplicação sobre o material da foto (kraft, papel…); o branco some.
     Unha e brilho do olho saem em magenta (#FF00FF) para virar tinta branca opaca na aplicação.
     ?peca=pouch · ?w=&h= -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Archivo; src: url(../../../fonts/Archivo-var-latin.woff2); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: IS; src: url(../../../fonts/InstrumentSans-var.woff2); font-weight: 400 700; }
@font-face { font-family: Mea; src: url(../../../fonts/MeaCulpa.woff2); }
@font-face { font-family: Mono; src: url(../../../fonts/SpaceMono-normal-700.woff2); font-weight: 700; }
html, body { margin: 0; background: #fff; }
#p { position: relative; overflow: hidden; background: #fff; }
.logo { position: absolute; width: 899px; height: 700px; transform-origin: 0 0; }
</style><script src="../gato-v3/gato.js"></script><script src="peixe/peixe.js"></script><script src="../logo.js"></script></head><body><div id="p"></div>
<script>
const q = new URLSearchParams(location.search), peca = q.get('peca') || 'pouch';
const W = +(q.get('w') || 1120), H = +(q.get('h') || 2000), p = document.getElementById('p');
p.style.width = W + 'px'; p.style.height = H + 'px';
const C = { cobalto: '#2B3FD1', rosa: '#F4B9CD', nanquim: '#1C1A24' }, MAG = '#FF00FF';
function logo(x, y, k, o) { const d = document.createElement('div'); d.className = 'logo'; d.style.cssText = `left:${x}px;top:${y}px;transform:scale(${k})`; p.appendChild(d); miauLogoV3(d, o); return d; }
Promise.all(['500 100px IS', '400 100px Mea', '900 100px Archivo'].map(f => document.fonts.load(f))).then(() => {
// padrão da marca (a partir do case RUTH da hola.carlydesign: embalagem 100% na cor, padrão gráfico grande, nome gigante
// cortado e texto miúdo em mono — a Emi: "o saco vai ser bege? essas são as coisas que a gente escolheu?").
// O padrão é nosso: olho de gato (o mesmo do logo: íris rosa, pupila em fenda, brilho) alternado com cápsula creme.
function padrao(x, y, w, h, cel, fundo, tipo = 'remedio') {
  let s = `<svg style="position:absolute;left:${x}px;top:${y}px" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="${fundo}"/>`;
  const r = cel * .4;
  for (let j = -1, l = 0; j * cel < h + cel; j++, l++) for (let i = -1; i * cel < w + cel; i++) {
    const cx = i * cel + cel / 2 + (l % 2 ? cel / 2 : 0), cy = j * cel + cel / 2;
    const olhoCor = fundo === C.rosa ? C.cobalto : C.rosa;
    // olho menor que o desenho do lado (a Emi: "os olhos são muito grandes"): ?olho= fração do raio, padrão .66
    const ro = r * +(q.get('olho') || .66);
    if ((i + l) % 2 === 0) s += `<g transform="translate(${cx} ${cy}) rotate(${(i * 7 + l * 13) % 2 ? 6 : -4})"><circle r="${ro}" fill="${olhoCor}"/>`
      + `<path d="M0 ${-ro * .8} Q${ro * .36} 0 0 ${ro * .8} Q${-ro * .36} 0 0 ${-ro * .8} Z" fill="${C.nanquim}"/><circle cx="${ro * .3}" cy="${-ro * .36}" r="${ro * .15}" fill="#F6EEDC"/></g>`;
    else if (tipo === 'peixe') { const kp = r * 2.15 / PEIXE.w;   // peixinho gerado no Figma e vetorizado (peixe/vetoriza.py)
      s += `<g transform="translate(${cx} ${cy}) rotate(-22) scale(${kp}) translate(${-PEIXE.w / 2} ${-PEIXE.h / 2})">`
        + `<path d="${PEIXE.creme}" fill="#F6EEDC"/><path d="${PEIXE.rosa}" fill="${olhoCor}"/><path d="${PEIXE.preto}" fill="${C.nanquim}"/></g>`; }
    else if (tipo === 'miau') s += `<text x="${cx}" y="${cy + r * .3}" text-anchor="middle" transform="rotate(-12 ${cx} ${cy})" font-family="Mea" font-size="${r * 1.35}" fill="#F6EEDC">miau</text>`;
    else if (tipo === 'patinha') s += `<g transform="translate(${cx} ${cy}) rotate(-14)" fill="#F6EEDC">`
      + `<path d="M0 ${-r * .02} C${r * .42} ${-r * .02} ${r * .62} ${r * .32} ${r * .52} ${r * .52} C${r * .42} ${r * .72} ${r * .14} ${r * .62} 0 ${r * .62} C${-r * .14} ${r * .62} ${-r * .42} ${r * .72} ${-r * .52} ${r * .52} C${-r * .62} ${r * .32} ${-r * .42} ${-r * .02} 0 ${-r * .02} Z"/>`
      + [[-.56, -.18, -18], [-.2, -.5, -6], [.2, -.5, 6], [.56, -.18, 18]].map(([x, y, a]) => `<ellipse cx="${r * x}" cy="${r * y}" rx="${r * .17}" ry="${r * .23}" transform="rotate(${a} ${r * x} ${r * y})"/>`).join('') + '</g>';
    else if (tipo === 'arranhao') { let g = `<g transform="translate(${cx} ${cy}) rotate(-22)">`;
      // três arranhões de unha como os do logo: retos, afinando, borda levemente irregular
      [-.42, 0, .42].forEach((ox, t) => { const L = r * (1.7 - Math.abs(ox) * .5), w = r * .1, n = 24; let e = [], d = [];
        for (let k = 0; k <= n; k++) { const f = k / n, y = -L / 2 + L * f, ww = w * Math.min(1, .45 + f / .08) * Math.pow(1 - f, .8);
          const j1 = 1 + .35 * Math.sin(f * 37 + t * 5), j2 = 1 + .35 * Math.sin(f * 29 + t * 3 + 1);
          e.push(`${(r * ox - ww * j1).toFixed(1)} ${y.toFixed(1)}`); d.unshift(`${(r * ox + ww * j2).toFixed(1)} ${y.toFixed(1)}`); }
        g += `<path d="M${e.concat(d).join(' L')} Z" fill="#F6EEDC"/>`; });
      s += g + '</g>'; }
    else if (tipo === 'olhos') continue;   // petisco: só o olho do logo (a Emi: "coisa vetorizada… feio demais" para pente/novelo/menta/peixe)
    else if (tipo === 'pente') s += `<g transform="translate(${cx} ${cy}) rotate(-28)">`
      // pentinho de gato (pelo & pele): costas arredondadas creme + dentes na cor do olho
      + `<rect x="${-r * 1.05}" y="${-r * .5}" width="${r * 2.1}" height="${r * .42}" rx="${r * .21}" fill="#F6EEDC"/>`
      + Array.from({ length: 9 }, (_, t) => `<rect x="${-r * .92 + t * r * .23}" y="${-r * .2}" width="${r * .11}" height="${r * .68}" rx="${r * .055}" fill="${olhoCor}"/>`).join('') + '</g>';
    else if (tipo === 'novelo') s += `<g transform="translate(${cx} ${cy}) rotate(-15)">`
      // novelo de lã (bola de pelo): bola creme com fios na cor do olho e uma pontinha de fio solta
      + `<circle r="${r * .7}" fill="#F6EEDC"/>`
      + [[-.5, .25], [-.15, .45], [.2, .5]].map(([o, k]) => `<path d="M${-r * .62} ${r * o} Q0 ${r * (o - k)} ${r * .62} ${r * (o + .1)}" fill="none" stroke="${olhoCor}" stroke-width="${r * .085}" stroke-linecap="round"/>`).join('')
      + `<path d="M${-r * .25} ${-r * .62} Q${r * .2} ${-r * .05} ${-r * .05} ${r * .66}" fill="none" stroke="${olhoCor}" stroke-width="${r * .085}" stroke-linecap="round"/>`
      + `<path d="M${r * .62} ${r * .3} Q${r * 1.0} ${r * .55} ${r * .9} ${r * .9} T${r * 1.15} ${r * 1.1}" fill="none" stroke="#F6EEDC" stroke-width="${r * .085}" stroke-linecap="round"/></g>`;
    else if (tipo === 'menta') s += `<g transform="translate(${cx} ${cy}) rotate(-30)">`   // no manteiga a folha creme sumia: vira cobalto
      // folhinha de menta (bafinho): duas folhas creme com nervura na cor do olho
      + [[-1, -.2], [1, .25]].map(([lado, dy]) => `<g transform="translate(${lado * r * .32} ${r * dy}) rotate(${lado * 32})"><path d="M0 ${r * .62} C${-r * .55} ${r * .2} ${-r * .45} ${-r * .45} 0 ${-r * .72} C${r * .45} ${-r * .45} ${r * .55} ${r * .2} 0 ${r * .62} Z" fill="${fundo === '#F2DC8B' ? C.cobalto : '#F6EEDC'}"/>`
        + `<path d="M0 ${r * .55} L0 ${-r * .55}" stroke="${fundo === '#F2DC8B' ? '#F6EEDC' : olhoCor}" stroke-width="${r * .07}" stroke-linecap="round"/>`
        + `<path d="M0 ${r * .1} L${-r * .22} ${-r * .12} M0 ${-r * .15} L${r * .2} ${-r * .36}" stroke="${fundo === '#F2DC8B' ? '#F6EEDC' : olhoCor}" stroke-width="${r * .06}" stroke-linecap="round"/></g>`).join('') + '</g>';
    else s += `<g transform="translate(${cx} ${cy}) rotate(-35)"><rect x="${-r * 1.05}" y="${-r * .42}" width="${r * 2.1}" height="${r * .84}" rx="${r * .42}" fill="#F6EEDC"/>`
      + `<rect x="0" y="${-r * .42}" width="${r * 1.05}" height="${r * .84}" rx="${r * .42}" fill="${olhoCor}"/><rect x="0" y="${-r * .42}" width="${r * .45}" height="${r * .84}" fill="${olhoCor}"/></g>`;
  }
  p.insertAdjacentHTML('beforeend', s + '</svg>');
}
if (peca === 'padrao') {   // só o padrão, em tela cheia (prancha de padrões do Behance): ?tipo=peixe|remedio&cor=cobalto|rosa&cel=
  const fundo = { cobalto: C.cobalto, rosa: C.rosa, manteiga: '#F2DC8B' }[q.get('cor') || 'cobalto'];
  padrao(0, 0, W, H, +(q.get('cel') || W / 2.4), fundo, q.get('tipo') || 'peixe');
}
if (peca === 'pouch') {
  // pouch inteiro numa cor da marca (?cor=cobalto|rosa|manteiga): microtexto mono no alto, padrão de olhos, faixa com o
  // nome do produto (?nome= ?l1= ?l2=), logo INTEIRO com .lab no pé
  const esq = { cobalto: [C.cobalto, C.rosa, C.rosa], rosa: [C.rosa, C.cobalto, C.cobalto], manteiga: ['#F2DC8B', C.cobalto, C.cobalto] }[q.get('cor') || 'cobalto'];
  const [fundo, tinta, faixa] = esq, corFaixaTexto = faixa === C.rosa ? C.nanquim : '#F6EEDC';
  const nome = q.get('nome') || 'PELO & PELE', l1 = q.get('l1') || 'PETISCO FUNCIONAL COM ÔMEGA 3 E BIOTINA', l2 = q.get('l2') || 'PRA UM PELO QUE BRILHA · 60 G';
  p.style.background = fundo;
  const m = W * .07, cel = W / 3.2;
  p.insertAdjacentHTML('beforeend', `<div style="position:absolute;left:0;right:0;top:${H * .135}px;text-align:center;font:700 ${W * .026}px/1 Mono;letter-spacing:.12em;color:${tinta}">MIAU.LAB · FÓRMULA Nº${q.get('formula') || '01'} · FEITO PRA GATOS</div>`);
  const pTop = H * .17, pH = H * .3; padrao(0, pTop, W, pH, cel, fundo, q.get('icone') || 'peixe');   // petisco: olho + peixinho; cápsula só nos remédios
  const fTop = pTop + pH, fH = H * .165;
  p.insertAdjacentHTML('beforeend', `<div style="position:absolute;left:0;top:${fTop}px;width:${W}px;height:${fH}px;background:${faixa};color:${corFaixaTexto};box-sizing:border-box;padding:${fH * .14}px ${m}px 0">
     <div style="font:900 ${W * .155}px/.86 Archivo;font-stretch:62%;letter-spacing:.005em">${nome}</div>
     <div style="font:700 ${W * .028}px/1.35 Mono;margin-top:${fH * .1}px">${l1}<br>${l2}</div></div>`);
  const k = (W - 2 * m) / 899, x0 = m, y0 = H - m * 1.15 - 700 * k;
  logo(x0, y0, k, { cor: tinta, fundo, gato: C.nanquim, olho: C.rosa, labFundo: C.nanquim, labCor: '#F6EEDC' });
}
if (peca === 'pote') {
  // rótulo de pote (a Emi: "igual da referência do primeiro… pele e unha, bafinho, coisas relacionadas a gatos"):
  // como os potes da direção 05 — microtexto mono no alto, etiqueta preta com o nome do produto, linhas mono, padrão de
  // olhos à direita, e o logo MIAU inteiro com .lab no pé. ?cor=cobalto|rosa · ?nome= · ?l1= · ?l2=
  const cobalto = (q.get('cor') || 'cobalto') === 'cobalto';
  const fundo = cobalto ? C.cobalto : C.rosa, tinta = cobalto ? C.rosa : C.cobalto, m = W * .07;
  p.style.background = fundo;
  const nome = q.get('nome') || 'pelo & pele', l1 = q.get('l1') || 'ômega 3 + biotina', l2 = q.get('l2') || 'pra um pelo que brilha';
  p.insertAdjacentHTML('beforeend', `
    <div style="position:absolute;left:${m}px;right:${m}px;top:${H * .07}px;display:flex;justify-content:space-between;font:700 ${W * .022}px/1 Mono;letter-spacing:.1em;color:${tinta}"><span>FÓRMULA Nº${q.get('formula') || '01'}</span><span>PETISCO FUNCIONAL</span><span>30 UN.</span></div>
    <div style="position:absolute;left:${m}px;top:${H * .16}px">
      <div style="display:inline-block;background:${C.nanquim};color:#F6EEDC;font:600 ${W * .062}px/1 IS;letter-spacing:-.02em;padding:${W * .012}px ${W * .022}px ${W * .016}px">${nome}</div>
      <div style="font:700 ${W * .024}px/1.4 Mono;color:${tinta};margin-top:${W * .018}px;text-transform:uppercase">${l1}<br>${l2}</div></div>`);
  // (sem padrão no pote: atrás do gato e do logo ele embolava)
  const k = (W - 2 * m) / 899, y0 = H - m - 700 * k;
  logo(m, y0, k, { cor: tinta, fundo, gato: C.nanquim, olho: C.rosa, labFundo: C.nanquim, labCor: '#F6EEDC' });
}
if (peca === 'caixa') {
  // frente da caixinha de REMÉDIO (comprimidos): microtexto mono, etiqueta preta com o nome, linhas mono,
  // padrão olho + cápsula (cápsula só nos remédios) e o logo inteiro com .lab · ?cor= ?nome= ?l1= ?l2= ?formula=
  const cobalto = (q.get('cor') || 'cobalto') === 'cobalto';
  const fundo = cobalto ? C.cobalto : C.rosa, tinta = cobalto ? C.rosa : C.cobalto, m = W * .08;
  p.style.background = fundo;
  const nome = q.get('nome') || 'mobilidade', l1 = q.get('l1') || 'condroitina + glucosamina', l2 = q.get('l2') || 'pra subir no sofá sem drama', f = q.get('formula') || '05';
  p.insertAdjacentHTML('beforeend', `
    <div style="position:absolute;left:${m}px;right:${m}px;top:${H * .045}px;display:flex;justify-content:space-between;font:700 ${W * .03}px/1 Mono;letter-spacing:.1em;color:${tinta}"><span>FÓRMULA Nº${f}</span><span>30 COMPRIMIDOS</span></div>
    <div style="position:absolute;left:${m}px;top:${H * .09}px">
      <div style="display:inline-block;background:${C.nanquim};color:#F6EEDC;font:600 ${W * .085}px/1 IS;letter-spacing:-.02em;padding:${W * .016}px ${W * .03}px ${W * .022}px">${nome}</div>
      <div style="font:700 ${W * .032}px/1.4 Mono;color:${tinta};margin-top:${W * .025}px;text-transform:uppercase">${l1}<br>${l2}</div></div>`);
  padrao(0, H * .27, W, H * .36, W / 3, fundo, 'remedio');
  const k = (W - 2 * m) / 899, y0 = H - m - 700 * k;
  logo(m, y0, k, { cor: tinta, fundo, gato: C.nanquim, olho: C.rosa, labFundo: C.nanquim, labCor: '#F6EEDC' });
}
document.body.dataset.pronto = 1;
});
</script></body></html>
