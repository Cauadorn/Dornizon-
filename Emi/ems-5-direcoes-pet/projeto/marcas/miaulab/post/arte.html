<!doctype html>
<!-- MIAU.LAB · arte plana das embalagens (vai para o mockup por homografia em aplica-mockup.py).
     Fundo branco: tudo vira tinta por multiplicação sobre o material da foto (kraft, papel…); o branco some.
     Unha e brilho do olho saem em magenta (#FF00FF) para virar tinta branca opaca na aplicação.
     ?peca=pouch · ?w=&h= -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Archivo; src: url(../../../fonts/Archivo-var-latin.woff2); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: IS; src: url(../../../fonts/InstrumentSans-var.woff2); font-weight: 400 700; }
@font-face { font-family: Mea; src: url(../../../fonts/MeaCulpa.woff2); }
@font-face { font-family: Mono; src: url(../../../fonts/SpaceMono-normal-700.woff2); font-weight: 700; }
html, body { margin: 0; background: #fff; }
#p { position: relative; overflow: hidden; background: #fff; }
.logo { position: absolute; width: 899px; height: 700px; transform-origin: 0 0; }
</style><script src="../gato-v3/gato.js"></script><script src="../logo.js"></script></head><body><div id="p"></div>
<script>
const q = new URLSearchParams(location.search), peca = q.get('peca') || 'pouch';
const W = +(q.get('w') || 1120), H = +(q.get('h') || 2000), p = document.getElementById('p');
p.style.width = W + 'px'; p.style.height = H + 'px';
const C = { cobalto: '#2B3FD1', rosa: '#F4B9CD', nanquim: '#1C1A24' }, MAG = '#FF00FF';
function logo(x, y, k, o) { const d = document.createElement('div'); d.className = 'logo'; d.style.cssText = `left:${x}px;top:${y}px;transform:scale(${k})`; p.appendChild(d); miauLogoV3(d, o); return d; }
Promise.all(['500 100px IS', '400 100px Mea', '900 100px Archivo'].map(f => document.fonts.load(f))).then(() => {
// padrão da marca (a partir do case RUTH da hola.carlydesign: embalagem 100% na cor, padrão gráfico grande, nome gigante
// cortado e texto miúdo em mono — a Emi: "o saco vai ser bege? essas são as coisas que a gente escolheu?").
// O padrão é nosso: olho de gato (o mesmo do logo: íris rosa, pupila em fenda, brilho) alternado com cápsula creme.
function padrao(x, y, w, h, cel, fundo) {
  let s = `<svg style="position:absolute;left:${x}px;top:${y}px" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="${fundo}"/>`;
  const r = cel * .4;
  for (let j = -1, l = 0; j * cel < h + cel; j++, l++) for (let i = -1; i * cel < w + cel; i++) {
    const cx = i * cel + cel / 2 + (l % 2 ? cel / 2 : 0), cy = j * cel + cel / 2;
    const olhoCor = fundo === C.rosa ? C.cobalto : C.rosa;
    if ((i + l) % 2 === 0) s += `<g transform="translate(${cx} ${cy}) rotate(${(i * 7 + l * 13) % 2 ? 6 : -4})"><circle r="${r}" fill="${olhoCor}"/>`
      + `<path d="M0 ${-r * .8} Q${r * .36} 0 0 ${r * .8} Q${-r * .36} 0 0 ${-r * .8} Z" fill="${C.nanquim}"/><circle cx="${r * .3}" cy="${-r * .36}" r="${r * .15}" fill="#F6EEDC"/></g>`;
    else s += `<g transform="translate(${cx} ${cy}) rotate(-35)"><rect x="${-r * 1.05}" y="${-r * .42}" width="${r * 2.1}" height="${r * .84}" rx="${r * .42}" fill="#F6EEDC"/>`
      + `<rect x="0" y="${-r * .42}" width="${r * 1.05}" height="${r * .84}" rx="${r * .42}" fill="${olhoCor}"/><rect x="0" y="${-r * .42}" width="${r * .45}" height="${r * .84}" fill="${olhoCor}"/></g>`;
  }
  p.insertAdjacentHTML('beforeend', s + '</svg>');
}
if (peca === 'pouch') {
  // pouch inteiro numa cor da marca (?cor=cobalto|rosa|manteiga): microtexto mono no alto, padrão de olhos, faixa com o
  // nome do produto (?nome= ?l1= ?l2=), logo INTEIRO com .lab no pé
  const esq = { cobalto: [C.cobalto, C.rosa, C.rosa], rosa: [C.rosa, C.cobalto, C.cobalto], manteiga: ['#F2DC8B', C.cobalto, C.cobalto] }[q.get('cor') || 'cobalto'];
  const [fundo, tinta, faixa] = esq, corFaixaTexto = faixa === C.rosa ? C.nanquim : '#F6EEDC';
  const nome = q.get('nome') || 'PELO & PELE', l1 = q.get('l1') || 'PETISCO FUNCIONAL COM ÔMEGA 3 E BIOTINA', l2 = q.get('l2') || 'PRA UM PELO QUE BRILHA · 60 G';
  p.style.background = fundo;
  const m = W * .07, cel = W / 3.2;
  p.insertAdjacentHTML('beforeend', `<div style="position:absolute;left:0;right:0;top:${H * .135}px;text-align:center;font:700 ${W * .026}px/1 Mono;letter-spacing:.12em;color:${tinta}">MIAU.LAB · FÓRMULA Nº07 · FEITO PRA GATOS</div>`);
  const pTop = H * .17, pH = H * .3; padrao(0, pTop, W, pH, cel, fundo);
  const fTop = pTop + pH, fH = H * .165;
  p.insertAdjacentHTML('beforeend', `<div style="position:absolute;left:0;top:${fTop}px;width:${W}px;height:${fH}px;background:${faixa};color:${corFaixaTexto};box-sizing:border-box;padding:${fH * .14}px ${m}px 0">
     <div style="font:900 ${W * .155}px/.86 Archivo;font-stretch:62%;letter-spacing:.005em">${nome}</div>
     <div style="font:700 ${W * .028}px/1.35 Mono;margin-top:${fH * .1}px">${l1}<br>${l2}</div></div>`);
  const k = (W - 2 * m) / 899, x0 = m, y0 = H - m * 1.15 - 700 * k;
  logo(x0, y0, k, { cor: tinta, fundo, gato: C.nanquim, olho: C.rosa, labFundo: C.nanquim, labCor: '#F6EEDC' });
}
if (peca === 'pote') {
  // rótulo de pote (a Emi: "igual da referência do primeiro… pele e unha, bafinho, coisas relacionadas a gatos"):
  // como os potes da direção 05 — microtexto mono no alto, etiqueta preta com o nome do produto, linhas mono, padrão de
  // olhos à direita, e o logo MIAU inteiro com .lab no pé. ?cor=cobalto|rosa · ?nome= · ?l1= · ?l2=
  const cobalto = (q.get('cor') || 'cobalto') === 'cobalto';
  const fundo = cobalto ? C.cobalto : C.rosa, tinta = cobalto ? C.rosa : C.cobalto, m = W * .07;
  p.style.background = fundo;
  const nome = q.get('nome') || 'pelo & pele', l1 = q.get('l1') || 'ômega 3 + biotina', l2 = q.get('l2') || 'pra um pelo que brilha';
  p.insertAdjacentHTML('beforeend', `
    <div style="position:absolute;left:${m}px;right:${m}px;top:${H * .07}px;display:flex;justify-content:space-between;font:700 ${W * .022}px/1 Mono;letter-spacing:.1em;color:${tinta}"><span>FÓRMULA Nº07</span><span>PETISCO FUNCIONAL</span><span>30 UN.</span></div>
    <div style="position:absolute;left:${m}px;top:${H * .16}px">
      <div style="display:inline-block;background:${C.nanquim};color:#F6EEDC;font:600 ${W * .062}px/1 IS;letter-spacing:-.02em;padding:${W * .012}px ${W * .022}px ${W * .016}px">${nome}</div>
      <div style="font:700 ${W * .024}px/1.4 Mono;color:${tinta};margin-top:${W * .018}px;text-transform:uppercase">${l1}<br>${l2}</div></div>`);
  // (sem padrão no pote: atrás do gato e do logo ele embolava)
  const k = (W - 2 * m) / 899, y0 = H - m - 700 * k;
  logo(m, y0, k, { cor: tinta, fundo, gato: C.nanquim, olho: C.rosa, labFundo: C.nanquim, labCor: '#F6EEDC' });
}
document.body.dataset.pronto = 1;
});
</script></body></html>
