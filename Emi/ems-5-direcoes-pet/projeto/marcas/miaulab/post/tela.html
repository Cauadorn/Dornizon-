<!doctype html>
<!-- MIAU.LAB · post de apresentação da identidade (formato do case da Melt/Ayeida: referencias/miaulab/post-melt-ayeida).
     Telas animadas: a cor troca seca, como nas lâminas 1 e 4 da referência.
     ?n=1 · capa: o símbolo em close (gato espiando por cima do U gigante, arranhões), texto encaixado nas hastes do U
     ?n=4 · logo inteiro centralizado, bloco compacto, cor invertendo
     ?e=0,1,2… estado de cor · ?w=&h= -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Archivo; src: url(../../../fonts/Archivo-var-latin.woff2); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: Mono; src: url(../../../fonts/SpaceMono-normal-700.woff2); font-weight: 700; }
@font-face { font-family: IS; src: url(../../../fonts/InstrumentSans-var.woff2); font-weight: 400 700; }
@font-face { font-family: Mea; src: url(../../../fonts/MeaCulpa.woff2); }
html, body { margin: 0; }
#p { position: relative; overflow: hidden; }
.logo { position: absolute; width: 899px; height: 700px; transform-origin: 0 0; }
.pilula { position: absolute; border: 2.5px solid currentColor; border-radius: 999px; padding: 15px 34px 14px; font: 500 27px/1 IS; letter-spacing: .08em; white-space: nowrap; }
</style><script src="../gato-v3/gato.js"></script><script src="../logo.js"></script></head><body><div id="p"></div>
<script>
const q = new URLSearchParams(location.search), n = +(q.get('n') || 1), e = +(q.get('e') || 0);
const W = +(q.get('w') || 1440), H = +(q.get('h') || 1800), p = document.getElementById('p');
p.style.width = W + 'px'; p.style.height = H + 'px';
const C = { cobalto: '#2B3FD1', rosa: '#F4B9CD', creme: '#F6EEDC', manteiga: '#F2DC8B', nanquim: '#1C1A24' };
const cv = document.createElement('canvas').getContext('2d');
function logo(x, y, k, o) {
  const d = document.createElement('div'); d.className = 'logo'; d.style.cssText = `left:${x}px;top:${y}px;transform:scale(${k})`; p.appendChild(d);
  miauLogoV3(d, o); return d;
}
Promise.all(['500 100px IS', '400 100px Mea', '900 100px Archivo', '700 64px Mono'].map(f => document.fonts.load(f))).then(() => {
if (n === 1) {
  // estados: [fundo, letra] · rosa/cobalto → manteiga/cobalto → cobalto/rosa (na referência: rosa → manteiga → azul)
  const E = [[C.rosa, C.cobalto], [C.manteiga, C.cobalto], [C.cobalto, C.rosa]][e % 3];
  p.style.background = E[0];
  // o U ocupa ~92% da largura; o gato centralizado; as hastes descem até sangrar no pé da lâmina
  const k = W * .92 / 202, x0 = W / 2 - 798 * k, y0 = H * .14 - 143.6 * k;
  logo(x0, y0, k, { cor: E[1], fundo: E[0], gato: C.nanquim, olho: C.rosa, lab: false });
  // texto encaixado nas hastes, na cor do fundo (como o "Freshly baked. Worth melting for." no copo da Melt):
  // os dois blocos alinhados pela base, com a mesma margem das laterais da haste
  const xE = x0 + 697 * k, xD = x0 + 814 * k, m = 54, pe = H - 96;
  p.insertAdjacentHTML('beforeend', `
    <div id="tE" style="position:absolute;left:${xE + m}px;bottom:${H - pe}px;font:500 56px/1 IS;letter-spacing:-.025em;color:${E[0]}">Fórmula<br>veterinária.<br>Feita pra gatos.</div>
    <div id="tD" style="position:absolute;left:${xD + m}px;bottom:${H - pe}px;color:${E[0]}">
      <div style="font:500 56px/1 IS;letter-spacing:-.025em">Ciência que</div>
      <div style="font:400 150px/.62 Mea;margin:16px 0 30px -4px">ronrona.</div>
      <div style="display:inline-block;border:2.5px solid currentColor;border-radius:99px;padding:13px 30px 12px;font:500 26px/1 IS;letter-spacing:.08em">MIAU.LAB</div></div>`);
} else if (n === 4) {
  // dois estados invertendo: cobalto/creme ↔ creme/cobalto (na referência: marrom/rosa ↔ rosa/marrom)
  const E = [[C.cobalto, C.creme, C.rosa, C.nanquim], [C.creme, C.cobalto, C.nanquim, C.creme]][e % 2];
  const [bg, cor, labFundo, labCor] = E; p.style.background = bg;
  const k = W * .74 / 899, x0 = (W - 899 * k) / 2, y0 = H / 2 - (141 + 700) / 2 * k - 40;
  const d = logo(x0, y0, k, { cor, fundo: bg, gato: C.nanquim, olho: C.rosa, labFundo, labCor });
  const f = 52, fonte = `500 ${f}px IS`; cv.font = fonte; const mm = cv.measureText('F'), cap = mm.actualBoundingBoxAscent;
  const lh = 700 - 610 - cap, top = 610 + cap - (lh - (mm.fontBoundingBoxAscent + mm.fontBoundingBoxDescent)) / 2 - mm.fontBoundingBoxAscent;
  d.insertAdjacentHTML('beforeend', `<div style="position:absolute;left:-1px;top:${top}px;font:${fonte};line-height:${lh}px;letter-spacing:-.015em;color:${cor}">Fórmula veterinária.<br>Feita pra gatos.</div>`);
  // pílula encostada no bloco (uns 40 px abaixo da etiqueta), centralizada
  p.insertAdjacentHTML('beforeend', `<div class="pilula" style="left:50%;transform:translateX(-50%);top:${y0 + 700 * k + 44}px;color:${cor}">SUPLEMENTO P/ GATOS</div>`);
}
document.body.dataset.pronto = 1;
});
</script></body></html>
