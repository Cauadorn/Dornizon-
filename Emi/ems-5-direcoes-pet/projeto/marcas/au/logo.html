<!doctype html>
<!-- Logo AU RUNNING CLUB (direção "modo atleta"). Referências que a Emi escolheu (referencias/au-running-club/identidade):
     1 RUN CLUB  → letra pesada, arredondada e inclinada, com um balanço líquido; verde-limão, preto e azul elétrico;
     7 TRC       → o nome tem movimento (aqui, o cachorro salta por cima dele);
     18 Wild Pup → silhueta de cachorro em salto com o vão da coleira, fundo chapado com grão, letrinhas correndo nas bordas.
     A marca é de corrida COM cachorro. v2 (a Emi: "o nome AU é feio", "tira o cachorro de junto do nome", "RUNNING CLUB com mais movimento"):
     nome MATILHA (o bando de cachorros = a turma do run club), cachorro solto acima com respiro, "RUNNING CLUB" leve numa onda suave.
     A tentativa de dar pernas e tênis às letras desenhando à mão ficou feia (logo-tentativa-pernas.html): a Emi reprovou.
     A silhueta foi gerada (gpt-image no Figma) e limpa em limpa_silhueta.py.
     Uso: logo.html | ?nome=TROTE | ?fundo=#4342FF&tinta=#CCFF3E | ?bordas=0
          quadro da lâmina: ?bordas=0&w=452&h=430&escala=.45&dx=-11.5&dy=8 (img/matilha-marca.jpg; centro da tinta medido na área visível, sem a sangria) -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: RubikI; src: url(../../fonts/Rubik-italic-var-latin.woff2); font-weight: 300 900; }
@font-face { font-family: Rubik; src: url(../../fonts/Rubik-var-latin.woff2); font-weight: 300 900; }
html, body { margin: 0; }
.palco { position: relative; width: 1080px; height: 1080px; overflow: hidden; background: var(--fundo); }
.grao { position: absolute; inset: 0; opacity: .28; mix-blend-mode: multiply; pointer-events: none; }
.borda { position: absolute; left: 44px; right: 44px; display: flex; justify-content: space-between; font: 700 19px/1 Rubik; letter-spacing: .12em; color: var(--tinta); text-transform: uppercase; }
.logo { position: absolute; left: 50%; top: 53%; transform: translate(-50%, -50%); width: 820px; display: flex; flex-direction: column; align-items: center; }
.cao { display: block; width: 470px; height: 278px; margin: 0 0 21px 60px; overflow: visible; }  /* vão até o MATILHA = 24px, igual ao do RUNNING CLUB */
.nome { filter: url(#liquido); color: var(--tinta); display: flex; flex-direction: column; align-items: center; }
.mt { font: 900 200px/.8 RubikI; letter-spacing: -.015em; white-space: nowrap; }
svg.rc { display: block; overflow: visible; margin-top: 0; }
.rc text { font: 600 64px RubikI; fill: var(--tinta); letter-spacing: .12em; }
</style></head><body>
<svg width="0" height="0" style="position:absolute"><filter id="liquido" x="-10%" y="-10%" width="120%" height="120%">
  <feTurbulence type="fractalNoise" baseFrequency=".0045 .007" numOctaves="1" seed="4" result="r"/>
  <feDisplacementMap in="SourceGraphic" in2="r" scale="22" xChannelSelector="R" yChannelSelector="G" result="d"/>
  <!-- borda lisa depois da deformação: desfoca e endurece o alfa de novo -->
  <feGaussianBlur in="d" stdDeviation="1.6" result="b"/>
  <feComponentTransfer in="b" result="a"><feFuncA type="linear" slope="6" intercept="-2.4"/></feComponentTransfer>
  <feFlood class="cor-tinta" flood-color="#121212"/><feComposite in2="a" operator="in"/>
</filter>
<filter id="tinge"><feFlood class="cor-tinta" flood-color="#121212"/><feComposite in2="SourceAlpha" operator="in"/></filter>
<filter id="ruido"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.4 -.35"/></filter></svg>
<div class="palco">
  <svg class="grao" width="1080" height="1080"><rect width="1080" height="1080" filter="url(#ruido)"/></svg>
  <div class="borda" style="top:40px"><span>matilha running club</span><span>—</span><span>corre com ele</span><span>—</span><span>matilha running club</span></div>
  <div class="logo">
    <svg class="cao" viewBox="0 0 2172 1285"><image href="cao-salto.png" width="2172" height="1285" filter="url(#tinge)"/></svg>
    <div class="nome">
      <div class="mt">MATILHA</div>
      <!-- "RUNNING CLUB" numa onda bem suave e mais leve (a Emi: "mantém running club, com menos curva e mais delicado") -->
      <svg class="rc" width="760" height="110" viewBox="0 0 760 110"><path id="onda" d="M20 74 C 190 56, 300 58, 380 72 S 590 90, 740 66" fill="none"/>
        <text><textPath href="#onda" startOffset="50%" text-anchor="middle">RUNNING CLUB</textPath></text></svg>
    </div>
  </div>
  <div class="borda" style="bottom:40px"><span>5K todo domingo</span><span>—</span><span>todo cachorro corre</span><span>—</span><span>5K todo domingo</span></div>
</div>
<script>
const q = new URLSearchParams(location.search), s = document.documentElement.style;
s.setProperty('--fundo', q.get('fundo') || '#CCFF3E'); s.setProperty('--tinta', q.get('tinta') || '#121212'); s.setProperty('--destaque', q.get('destaque') || '#4342FF');
document.querySelectorAll('.cor-tinta').forEach(e => e.setAttribute('flood-color', q.get('tinta') || '#121212'));
if (q.get('bordas') === '0') document.querySelectorAll('.borda').forEach(e => e.remove());
if (q.get('w')) { const pc = document.querySelector('.palco'); pc.style.width = q.get('w') + 'px'; pc.style.height = q.get('h') + 'px'; }
if (q.get('escala')) document.querySelector('.logo').style.transform = `translate(calc(-50% + ${q.get('dx') || 0}px), calc(-50% + ${q.get('dy') || 0}px)) scale(${q.get('escala')})`;
// o nome ocupa 760px de largura (cabe qualquer nome curto)
if (q.get('nome')) { document.querySelector('.mt').textContent = q.get('nome'); document.querySelectorAll('.borda span').forEach(e => e.textContent = e.textContent.replace('matilha', q.get('nome').toLowerCase())); }
document.fonts.ready.then(() => { const mt = document.querySelector('.mt'); mt.style.fontSize = (200 * 760 / mt.offsetWidth) + 'px'; });   // offsetWidth: largura sem a escala do transform
</script></body></html>
