<!doctype html>
<!-- Maison Caramelo · logo v2. Referências que a Emi escolheu (referencias/maison-caramelo/brasao): 14 Eros & Co. e 15 oval floral em relevo.
     Do 14: um bicho pequeno em silhueta preta, estilo vaso grego (chapado com linhas finas vazadas), sobre o nome em serifa clássica espaçada,
     com muito respiro. O bicho é um vira-lata caramelo empinado (ou saltando) com uma florzinha na boca, como o Eros que segura a flor.
     Do 15: o selo oval de borda recortada, prensado tom sobre tom (selo.html).
     A v1 (medalhão com o retrato, "tá literalmente copiando a referência") fica em v1-medalhao/.
     ?cao=empinado|saltando · ?fundo=&tinta=&corcao= · ?w=&h=&escala=&dx=&dy= · servidor http (mask-image) -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Cormorant; src: url(../../fonts/CormorantGaramond-var.woff2); font-weight: 300 700; }
html, body { margin: 0; }
.palco { position: relative; overflow: hidden; background: var(--fundo); }
.logo { position: absolute; left: 50%; top: 50%; transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 0px))) scale(var(--escala, 1)); display: flex; flex-direction: column; align-items: center; }
.cao { background: var(--cor-cao, var(--tinta)); -webkit-mask: var(--arq) center / contain no-repeat; mask: var(--arq) center / contain no-repeat; }
.nome { margin-top: 46px; font: 500 50px/1 Cormorant; letter-spacing: .2em; padding-left: .2em; color: var(--tinta); white-space: nowrap; }
</style></head><body>
<div class="palco"><div class="logo"><div class="cao"></div><div class="nome">MAISON CARAMELO</div></div></div>
<script>
const q = new URLSearchParams(location.search), s = document.documentElement.style;
s.setProperty('--fundo', q.get('fundo') || '#EDE8DD'); s.setProperty('--tinta', q.get('tinta') || '#2B1416');
if (q.get('corcao')) s.setProperty('--cor-cao', q.get('corcao'));   // ex.: o cachorro em caramelo e o nome em vinho
const cao = q.get('cao') || 'empinado', T = { empinado: [796.8, 713], saltando: [756.8, 562.8] }[cao];
s.setProperty('--arq', `url(caramelo-${cao}.svg)`);
const c = document.querySelector('.cao'), larg = cao === 'empinado' ? 250 : 270; c.style.width = larg + 'px'; c.style.height = larg * T[1] / T[0] + 'px';
const W = +(q.get('w') || 1080), H = +(q.get('h') || 1080), pc = document.querySelector('.palco'); pc.style.width = W + 'px'; pc.style.height = H + 'px';
for (const k of ['escala', 'dx', 'dy']) if (q.get(k)) s.setProperty('--' + k, q.get(k) + (k === 'escala' ? '' : 'px'));
</script></body></html>
