<!doctype html>
<!-- Maison Caramelo · arte do outdoor (proporção do painel da foto: 650 × 361 → 1800 × 1000).
     Esquema da PATTU (a Emi: "outdoor numa parede de tijolo com uma pessoa passeando com o cachorro"), sem copiar o layout:
     à esquerda um painel vinho com o logo em creme e uma linha pequena; à direita a foto da campanha (caramelo de suéter
     de tricô no fundo vinho, gerada). Servidor http (mask-image). -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Cormorant; src: url(../../../fonts/CormorantGaramond-var.woff2); font-weight: 300 700; }
html, body { margin: 0; }
.o { position: relative; width: 1800px; height: 1000px; overflow: hidden; background: #4A1D22; display: flex; }
.painel { width: 720px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.cao { width: 290px; height: 260px; background: #EDE3CC; -webkit-mask: url(../caramelo-empinado.svg) center / contain no-repeat; mask: url(../caramelo-empinado.svg) center / contain no-repeat; }
.nome { margin-top: 44px; font: 500 46px/1 Cormorant; letter-spacing: .18em; padding-left: .18em; color: #EDE3CC; white-space: nowrap; }
.linha { margin-top: 48px; font: 600 24px/1 Cormorant; letter-spacing: .3em; padding-left: .3em; color: #C9A97F; }
.foto { flex: 1; background: url(foto-campanha.png) 92% 30% / 112%; background-repeat: no-repeat; background-color: #4A1D22; }
</style></head><body>
<div class="o"><div class="painel"><div class="cao"></div><div class="nome">MAISON CARAMELO</div><div class="linha">TRICÔ · COURO · ALFAIATARIA</div></div><div class="foto"></div></div>
</body></html>
