<!doctype html>
<!-- Logo TOTÓ (direção "pop de gibi"), a partir da referência NOSY que a Emi escolheu:
     letra desenhada, gordinha e orgânica (Cherry Bomb One, com cada letra levemente girada),
     a pata é o primeiro "O": a almofada é o próprio O da fonte (redonda embaixo), os dedos ficam por cima;
     o "Ó" final mantém o acento (lê TOTÓ); as letras dançam (alturas e ângulos diferentes), como no NOSY. Sem traços de "farejar" (a Emi: "bigodes nada a ver"). Uso: logo.html?fundo=textura | logo.html?cor=#FFD23F&fundo=#2B59C3 -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Cherry; src: url(../../fonts/CherryBombOne-Regular.ttf); }
html, body { margin: 0; }
.palco { position: relative; width: 1080px; height: 1080px; overflow: hidden; display: grid; place-items: center; background: var(--fundo); background-size: cover; background-position: center; }
.logo { position: relative; display: flex; align-items: flex-end; color: var(--cor); filter: var(--sombra); }
.letras { font: 400 280px/0.8 Cherry; display: flex; align-items: baseline; gap: 0; letter-spacing: 0; }
.letras .l { display: inline-block; }
.letras > * + * { margin-left: 8px; }   /* letras juntinhas (a Emi: "pode juntar um pouquinho") */
.pata { display: inline-block; width: 221px; height: 291px; margin-bottom: -8px; }
.almofada-anel { display: none; } .anel .almofada-anel { display: inline; } .anel .almofada-solida { display: none; }
</style></head><body>
<div class="palco"><div class="logo">
  <span class="letras">
    <span class="l" style="transform:rotate(-6deg) translateY(10px)">T</span>
    <svg class="pata" viewBox="-30 -1010 790 1040" fill="currentColor" style="transform:rotate(6deg) translateY(-12px)">
      <g transform="scale(1 -1)">
        <!-- almofada = o próprio "O" da Cherry Bomb (redonda embaixo); ?pata=anel mantém o furo do O -->
        <path class="almofada-solida" d="M366 -1Q297 -2 236.0 24.0Q175 50 128.0 98.0Q81 146 54.0 210.0Q27 274 25 349Q24 421 50.0 484.0Q76 547 123.0 595.0Q170 643 232.0 670.5Q294 698 366 698Q435 699 496.0 673.0Q557 647 604.0 599.5Q651 552 678.5 488.0Q706 424 707 349Q709 277 682.5 214.0Q656 151 609.0 103.5Q562 56 499.5 28.5Q437 1 366 -1Z"/>
        <path class="almofada-anel" d="M366 -1Q297 -2 236.0 24.0Q175 50 128.0 98.0Q81 146 54.0 210.0Q27 274 25 349Q24 421 50.0 484.0Q76 547 123.0 595.0Q170 643 232.0 670.5Q294 698 366 698Q435 699 496.0 673.0Q557 647 604.0 599.5Q651 552 678.5 488.0Q706 424 707 349Q709 277 682.5 214.0Q656 151 609.0 103.5Q562 56 499.5 28.5Q437 1 366 -1ZM369 194Q413 194 446.5 226.0Q480 258 479 313Q479 369 446.0 401.0Q413 433 369 433Q325 433 292.0 401.0Q259 369 259 313Q259 258 292.0 226.0Q325 194 369 194Z"/>
        <!-- dedos por cima do O, um pouco desiguais (de propósito) -->
        <ellipse cx="88" cy="770" rx="68" ry="88" transform="rotate(30 88 770)"/>
        <ellipse cx="262" cy="900" rx="80" ry="102" transform="rotate(10 262 900)"/>
        <ellipse cx="478" cy="905" rx="80" ry="102" transform="rotate(-10 478 905)"/>
        <ellipse cx="646" cy="768" rx="68" ry="88" transform="rotate(-30 646 768)"/>
      </g>
    </svg>
    <span class="l" style="transform:rotate(4deg) translateY(2px)">T</span>
    <span class="l" style="transform:rotate(-5deg) translateY(-4px) scale(1.04)">Ó</span>
  </span>
</div></div>
<script>
const q = new URLSearchParams(location.search), raiz = document.documentElement.style;
const fundo = q.get('fundo') || 'textura';
raiz.setProperty('--fundo', fundo === 'textura' ? 'url(textura-massa.png)' : fundo);
raiz.setProperty('--cor', q.get('cor') || '#FFF1D6');
if (q.get('pata') === 'anel') document.querySelector('.logo').classList.add('anel');
if (q.get('escala')) Object.assign(document.querySelector('.logo').style, { position: 'absolute', left: '50%', top: '50%', transform: `translate(calc(-50% + ${q.get('dx') || 0}px), calc(-50% + ${q.get('dy') || 0}px)) scale(${q.get('escala')})` });
if (q.get('w')) { const pc = document.querySelector('.palco'); pc.style.width = q.get('w') + 'px'; pc.style.height = q.get('h') + 'px'; }
raiz.setProperty('--sombra', fundo === 'textura' ? 'drop-shadow(0 6px 6px rgba(90,20,5,.45)) drop-shadow(0 1px 1px rgba(90,20,5,.5))' : 'none');
</script></body></html>
