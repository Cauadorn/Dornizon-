<!doctype html>
<!-- Frente do pacote TOTÓ (660 x 1000), a partir da referência Pikku que a Emi mandou, na identidade do TOTÓ:
     duas cores (vermelho + creme), nome grande, nome do produto, ilustração chapada de cachorro pegando o biscoito
     com os farelos em retícula de gibi, faixa amarela de sabor (a etiqueta em grade ficou cópia do Pikku e foi reprovada). Topo (0-150) = fecho do pacote. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Bungee; src: url(../../../fonts/Bungee-Regular.ttf); }
@font-face { font-family: Cherry; src: url(../../../fonts/CherryBombOne-Regular.ttf); }
@font-face { font-family: Poppins; src: url(../../../fonts/Poppins-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: Poppins; src: url(../../../fonts/Poppins-Medium.ttf); font-weight: 500; }
html, body { margin: 0; }
.frente { position: relative; width: 660px; height: 1000px; overflow: hidden; background: #F2542D; color: #FFF1D6; }
.logo { position: absolute; left: 50%; top: 186px; width: 500px; transform: translateX(-50%); }
.produto { position: absolute; left: 70px; top: 418px; font: 400 37px/1.02 Bungee; letter-spacing: .01em; color: #FFD23F; }
.sub { position: absolute; left: 72px; top: 512px; font: 500 21px/1.25 Poppins; }
.cao { position: absolute; left: 352px; top: 378px; width: 262px; z-index: 2; }
.farelos { position: absolute; left: 236px; top: 560px; width: 190px; height: 150px; }
/* faixa amarela de sabor: o cachorro pousa nela */
.faixa { position: absolute; left: 0; right: 0; top: 784px; height: 216px; background: #FFD23F; color: #E0451F; }
.faixa .sabor { position: absolute; left: 70px; top: 40px; font: 400 40px/1 Cherry; }
.faixa .info { position: absolute; left: 72px; top: 100px; font: 600 15px/1.45 Poppins; color: #1B1B1B; }
.faixa .peso { position: absolute; right: 56px; top: 84px; width: 104px; height: 104px; border-radius: 50%; background: #E0451F; color: #FFF1D6;
  display: grid; place-items: center; text-align: center; font: 400 30px/.9 Cherry; transform: rotate(-8deg); }
.faixa .peso small { display: block; font: 600 11px/1 Poppins; letter-spacing: .14em; margin-top: 4px; }
</style></head><body>
<div class="frente">
  <img class="logo" src="../logo-toto-creme.png" alt="TOTÓ">
  <div class="produto">PETISCO<br>DE FORNO</div>
  <div class="sub">pra cachorro<br>que sempre pede bis</div>
  <svg class="farelos" viewBox="0 0 190 150" fill="#FFF1D6"></svg>
  <img class="cao" src="ilustra-cao-creme.png" alt="">
  <div class="faixa">
    <div class="sabor">frango &amp; batata-doce</div>
    <div class="info">assado no forno · sem corante<br>crocante por fora, macio por dentro</div>
    <div class="peso"><span>200g<small>ADULTO</small></span></div>
  </div>
</div>
<script>
// farelos em retícula de gibi: pontos que diminuem para a esquerda (como os da direção)
const f = document.querySelector('.farelos'); let h = '';
for (let y = 6; y < 150; y += 13) for (let x = 6; x < 190; x += 13) {
  const t = x / 190, dy = Math.abs(y - 75) / 75; const r = 4.6 * t * (1 - dy * .8);
  if (r > .9 && (x * 7 + y * 3) % 5 !== 0) h += `<circle cx="${x + (y % 26 ? 6 : 0)}" cy="${y}" r="${r.toFixed(2)}"/>`;
}
f.innerHTML = h;
</script>
</body></html>
