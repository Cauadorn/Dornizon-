<!doctype html>
<!-- pelo solto · logo final (aprovado pela Emi: "perfeito, somente isso, sem o poodle, sem as bolhas").
     Origem: conceito 1 gerado na IA (gerados/1-poodle-bolhas.png); só o nome foi aproveitado e vetorizado com potrace
     (vetoriza.py → nome.svg), para as curvas ficarem limpas. O BANHO & TOSA é recomposto em fonte de verdade
     (Poppins Light, caixa alta espaçada), centrado no eixo da tinta do nome, com margens iguais dos dois lados.
     Tinta do nome em nome.svg: x 18–622,75 · y 27,25–553,5 (viewBox 645 × 560).
     Centro da tinta: dx=2.5 no palco de 1200. Precisa de servidor http (mask-image; o .svg com image/svg+xml). ?fundo=&tinta= · ?w=&h=&escala=&dx=&dy= -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: PoppinsL; src: url(../../fonts/Poppins-300.woff2); font-weight: 300; }
html, body { margin: 0; }
.palco { position: relative; overflow: hidden; background: var(--fundo); }
.logo { position: absolute; left: 50%; top: 50%; width: 645px; height: 640px; transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 0px))) scale(var(--escala, 1)); }
.nome { position: absolute; left: 0; top: 0; width: 645px; height: 560px; background: var(--tinta);
  -webkit-mask: url(nome.svg) 0 0 / 645px 560px no-repeat; mask: url(nome.svg) 0 0 / 645px 560px no-repeat; }
.sub { position: absolute; top: 584px; font: 300 34px/1 PoppinsL; color: var(--tinta); white-space: nowrap; }
</style></head><body>
<div class="palco"><div class="logo"><div class="nome"></div><div class="sub" id="sub">BANHO &amp; TOSA</div></div></div>
<script>
const q = new URLSearchParams(location.search), s = document.documentElement.style;
s.setProperty('--fundo', q.get('fundo') || '#FDF6E5'); s.setProperty('--tinta', q.get('tinta') || '#5A2E17');
const W = +(q.get('w') || 1200), H = +(q.get('h') || 900), pc = document.querySelector('.palco'); pc.style.width = W + 'px'; pc.style.height = H + 'px';
if (q.get('escala')) s.setProperty('--escala', q.get('escala'));
if (q.get('dx')) s.setProperty('--dx', q.get('dx') + 'px'); if (q.get('dy')) s.setProperty('--dy', q.get('dy') + 'px');
document.fonts.load('300 34px PoppinsL').then(() => {
  // BANHO & TOSA: centrado no eixo da tinta do nome, 45 px para dentro de cada lado (como no conceito aprovado)
  const esq = 18 + 45, dir = 622.75 - 45, txt = 'BANHO & TOSA', n = txt.length;
  const c = document.createElement('canvas').getContext('2d'); c.font = '300 34px PoppinsL';
  const m = c.measureText(txt), tinta0 = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
  const ls = ((dir - esq) - tinta0) / (n - 1), sub = document.getElementById('sub');
  sub.style.letterSpacing = ls + 'px'; sub.style.left = (esq + m.actualBoundingBoxLeft) + 'px';
});
</script></body></html>
