<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>EMS · 5 direções criativas pra marcas pet</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="deck" id="deck"></div>
<script src="direcoes.js"></script>
<script>
// ---------- utilidades ----------
const CURSOR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 2 L21 10 L12.5 12.5 L9 21 Z"/></svg>';
const SEL = '<i></i><i></i><i></i><i></i>';
const W = 1080, H = 1350, SANGRIA = 30;
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const num = (i) => String(i).padStart(2, '0');
let pendentes = 0;

function marcaDagua(slide, y, tom = 'var(--ivory)') {
  const m = el('div', 'marcadagua', '<span>@ITS<b>EMS</b>DESIGN</span><span>@ITS<b>EMS</b>DESIGN</span><span>@ITS<b>EMS</b>DESIGN</span>');
  m.style.top = y + 'px'; m.style.color = tom; slide.appendChild(m);
}

// Foto inteira (cenário já fotografado, sem recorte) cobrindo a caixa: como object-fit: cover,
// com posição px/py (0 a 1, como object-position) e zoom opcional. Tamanho explícito para o export do Figma.
function cheia(caixa, c, Wc, Hc) {
  const img = el('img', 'foto' + (c.classe ? ' ' + c.classe : '')); img.src = 'img/' + c.src + '.' + (c.ext || 'jpg'); img.alt = c.src;
  img.onload = () => {
    const s = Math.max(Wc / img.naturalWidth, Hc / img.naturalHeight) * (c.zoom || 1);
    const w = img.naturalWidth * s, h = img.naturalHeight * s;
    img.style.cssText = `width:${w}px;height:${h}px;left:${(Wc - w) * (c.px ?? .5)}px;top:${(Hc - h) * (c.py ?? .5)}px`;
    pendentes--; };
  img.onerror = () => { img.remove(); pendentes--; };
  pendentes++;
  caixa.appendChild(img);
}

// SelectionBox do Figma + cursor multiplayer "emi" em volta de um retângulo do slide
function selecionar(slide, x, y, w, h, kx, ky) {
  const s = el('div', 'sel', SEL);
  const x0 = Math.max(x - 7, 12), y0 = Math.max(y - 7, 12), x1 = Math.min(x + w + 7, W - 12), y1 = Math.min(y + h + 7, H - 12);
  s.style.cssText = `left:${x0}px;top:${y0}px;width:${x1 - x0}px;height:${y1 - y0}px`;
  slide.appendChild(s);
  const k = el('div', 'cursor-emi', CURSOR + '<span>emi</span>');
  k.style.cssText = `left:${x + kx}px;top:${y + ky}px`;
  slide.appendChild(k);
}

// Estrela de 5 pontas em retícula (HalftoneStar): pontos que diminuem do centro para a borda.
function estrela({ cx, cy, R, passo = 15, cor, opacidade = .45, rot = -18, rmax = 6.2 }) {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const a = (rot - 90 + i * 36) * Math.PI / 180, r = i % 2 ? R * .45 : R;
    pts.push([Math.cos(a) * r, Math.sin(a) * r]);
  }
  const dentro = (x, y) => { let c = false; for (let i = 0, j = 9; i < 10; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; };
  let dots = '';
  for (let y = -R; y <= R; y += passo) for (let x = -R; x <= R; x += passo) {
    if (!dentro(x, y)) continue;
    const d = Math.hypot(x, y) / R, r = Math.max(.6, rmax * (1 - d * .95));
    dots += `<circle cx="${(x + R).toFixed(1)}" cy="${(y + R).toFixed(1)}" r="${r.toFixed(2)}"/>`;
  }
  const s = el('div', 'estrela');
  s.style.cssText = `left:${cx - R}px;top:${cy - R}px;opacity:${opacidade}`;
  s.innerHTML = `<svg width="${2 * R}" height="${2 * R}" fill="${cor}">${dots}</svg>`;
  return s;
}

// ---------- quadro (bloco) ----------
// Quem encosta na borda do canvas ganha sangria; arco e cápsula ficam inteiros (sem sangria lateral).
function bloco(slide, b) {
  const [x, y, w, h] = b.r;
  const lateral = b.forma ? 0 : SANGRIA;
  const bl = x <= 0 ? lateral : 0, br = x + w >= W ? lateral : 0;
  const bt = y <= 0 ? SANGRIA : 0, bb = y + h >= H ? SANGRIA : 0;
  const qw = w + bl + br, qh = h + bt + bb;
  const q = el('div', 'q' + (b.forma ? ' ' + b.forma : '') + (b.flutua != null ? ' flutua' : ''));
  q.style.cssText = `left:${x - bl}px;top:${y - bt}px;width:${qw}px;height:${qh}px;--bg:${b.bg}`;
  if (b.forma === 'arco') q.style.borderRadius = `${w / 2}px ${w / 2}px 22px 22px`;
  if (b.flutua != null) q.style.transform = `rotate(${b.flutua}deg)`;
  if (b.cheia) cheia(q, b.cheia, qw, qh);
  if (b.padrao) { const p = el('div', 'padrao'); p.style.background = b.padrao; q.appendChild(p); }
  if (b.html) {
    const pad = el('div', 'pad'); pad.style.cssText = `left:${bl}px;top:${bt}px;width:${w}px;height:${h}px`;
    pad.insertAdjacentHTML('beforeend', b.html); q.appendChild(pad);
  }
  slide.appendChild(q);
  if (b.escolhido) selecionar(slide, x, y, w, h, ...b.escolhido);
  return q;
}

// ---------- cartão da direção ----------
function cartao(slide, d, i) {
  const { r, modo = 'v', tam = 100, txt, chips } = d.cartao;
  const [x, y, w, h] = r;
  const bl = x <= 0 ? SANGRIA : 0, br = x + w >= W ? SANGRIA : 0, bt = y <= 0 ? SANGRIA : 0, bb = y + h >= H ? SANGRIA : 0;
  const c = el('div', 'cartao ' + modo + (bb && modo === 'v' ? ' baixo' : ''));
  c.style.cssText = `left:${x - bl}px;top:${y - bt}px;width:${w + bl + br}px;height:${h + bt + bb}px;--card:${d.card}`;
  const dentro = el('div', 'dentro'); dentro.style.cssText = `left:${bl}px;top:${bt}px;width:${w}px;height:${h}px`;
  const cab = `<div class="num"><span class="sel-inline">${SEL}direção ${num(i + 1)} / 05</span></div>`;
  const t = `<h2 style="font-size:${tam}px">${d.titulo}</h2>`;
  const p = `<p${txt ? ` style="font-size:${txt}px"` : ''}>${d.texto}</p>${d.letra ? `<div class="letra">letra: ${d.letra}</div>` : ''}`;
  const ch = chips ? `<div class="chips">${chips.map(([n, hex]) => `<div><span style="background:${hex}"></span><b>${n}</b><small>${hex}</small></div>`).join('')}</div>` : '';
  dentro.innerHTML = modo === 'h'
    ? `<div class="col1">${cab}${t}</div><div class="col2">${p}</div><span class="tag">@itsemsdesign${CURSOR}</span>`
    : `${cab}${t}${p}${ch}<span class="tag">@itsemsdesign${CURSOR}</span>`;
  c.appendChild(dentro);
  slide.appendChild(c);
}

// ---------- lâmina de direção: a mesma estrutura nas 5 ----------
// pet em destaque à esquerda; marca + foto quadrada à direita; embaixo cartão, foto alta e paleta + letra.
const GRADE = {
  heroi:    [0, 0, 640, 860],
  marca:    [658, 0, 422, 400],
  quadrado: [658, 418, 422, 442],
  cartao:   [0, 878, 520, 472],
  alto:     [538, 878, 260, 472],
  paleta:   [816, 878, 264, 227],
  tipo:     [816, 1123, 264, 227],
};

function laminaDirecao(d, i) {
  const s = el('section', 'slide dir'); s.dataset.nome = `lamina-${num(i + 2)}`;
  bloco(s, { r: GRADE.heroi, ...d.heroi });
  bloco(s, { r: GRADE.marca, bg: d.marca.bg, padrao: d.marca.padrao, html: d.marca.html, escolhido: d.marca.cursor });
  bloco(s, { r: GRADE.quadrado, ...d.quadrado });
  bloco(s, { r: GRADE.alto, ...d.alto });
  bloco(s, { r: GRADE.paleta, bg: '#fff', html: paleta(d.paleta) });
  bloco(s, { r: GRADE.tipo, bg: d.tipo.bg, html: tipo(d.tipo) });
  cartao(s, { ...d, cartao: { r: GRADE.cartao, tam: 96, txt: 23 } }, i);
  s.appendChild(el('div', 'grain'));
  return s;
}

// ---------- capa: capa de revista ----------
// O gato é o "modelo da capa": foto inteira no fundo, o nome da revista ("direções") atrás da cabeça
// (a mesma foto recortada vai por cima do título, alinhada pixel a pixel), chamadas das 5 direções à esquerda.
function capa() {
  const s = el('section', 'slide capa'); s.dataset.nome = 'lamina-01';
  cheia(s, CAPA.foto, W, H);
  s.insertAdjacentHTML('beforeend', `
    <div class="escurece"></div>
    <div class="meta"><span>ems design · revista de branding</span><span>edição pet · nov 2026</span></div>
    <div class="masthead">direções</div>`);
  cheia(s, { ...CAPA.foto, src: CAPA.recorte, ext: 'png', classe: 'recorte' }, W, H);
  s.insertAdjacentHTML('beforeend', `
    <div class="sub">criativas<br>pra marcas<br><em>pet</em></div>
    <div class="selo-redondo"><span>nenhuma<br>é patinha<br>+ osso</span></div>
    <div class="chamadas"><div class="rot">nesta edição</div>${DIRECOES.map((d, i) =>
      `<div class="item"><span class="n">${num(i + 1)}</span><span class="tx"><b>${d.titulo.replace(/<\/?em>/g, '')}</b><small>${d.pra}</small></span></div>`).join('')}</div>
    <div class="arrasta">↳ arrasta pra folhear</div>
    <div class="barras"><div class="b"></div><span>@itsemsdesign</span></div>`);
  s.appendChild(el('div', 'grain claro'));
  return s;
}

// ---------- chamada: enquete ----------
// O gato da chamada levanta a pata e "aperta" uma opção da enquete (recorte por cima do cartão).
function chamada() {
  const s = el('section', 'slide chamada'); s.dataset.nome = 'lamina-07';
  cheia(s, CHAMADA.foto, W, H);
  s.insertAdjacentHTML('beforeend', `
    <div class="grande">qual delas tem<br>a cara da sua<br><em>marca</em>?</div>
    <div class="enquete">
      <div class="topo"><span>enquete</span><b>vota nos comentários</b></div>
      ${DIRECOES.map((d, i) => `<div class="op${i === CHAMADA.marcada ? ' marcada' : ''}"><span class="n">${num(i + 1)}</span><span class="nm">${d.titulo.replace(/<\/?em>/g, '')}</span>
        <span class="pts">${d.paleta.slice(0, 3).map(([, hex]) => `<i style="background:${hex}"></i>`).join('')}</span></div>`).join('')}
    </div>`);
  cheia(s, { ...CHAMADA.foto, src: CHAMADA.recorte, ext: 'png', classe: 'recorte' }, W, H);
  s.insertAdjacentHTML('beforeend', `
    <div class="comenta">comenta o número ↓</div>
    <div class="dm">ou me chama na dm${CURSOR}</div>
    <img class="selo" src="img/selo-ems.png" alt="selo ems">
    <div class="assina">@itsemsdesign<br><span>emsdesign.com.br</span></div>`);
  s.appendChild(el('div', 'grain claro'));
  return s;
}

const deck = document.getElementById('deck');
deck.appendChild(capa());
DIRECOES.forEach((d, i) => deck.appendChild(laminaDirecao(d, i)));
deck.appendChild(chamada());
window.pronto = () => pendentes === 0 && document.fonts.status === 'loaded';
</script>
</body>
</html>
