<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>EMS – direção criativa com ia</title>
<style>
  @font-face { font-family: "Instrument Serif"; font-style: normal; src: url("fontes/InstrumentSerif-Regular.ttf"); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("fontes/InstrumentSerif-Italic.ttf"); }
  @font-face { font-family: "Poppins"; font-weight: 500; src: url("fontes/Poppins-Medium.ttf"); }
  @font-face { font-family: "Poppins"; font-weight: 600; src: url("fontes/Poppins-SemiBold.ttf"); }
  :root { --ivory:#fffbde; --manteiga:#f2cf7a; --ameixa:#3d1c46; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1b1b1b; display:flex; flex-wrap:wrap; gap:24px; padding:24px; }
  .slide { position:relative; width:1080px; height:1350px; overflow:hidden; background:var(--ameixa); flex:none; }
  .slide > img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  /* capa: foto limpa, título pequeno e discreto no canto, fontes e cores da EMS */
  .titulo { position:absolute; left:90px; top:90px; color:var(--ivory); font:500 54px/1.12 "Poppins", sans-serif; letter-spacing:-0.02em; }
  .titulo em { font:italic 400 64px/1 "Instrument Serif", serif; color:var(--manteiga); letter-spacing:-0.01em; }
  .handle { position:absolute; right:90px; top:104px; color:var(--ivory); opacity:.7; font:500 22px/1 "Poppins", sans-serif; }
  .grao { position:absolute; inset:0; opacity:.07; mix-blend-mode:overlay; pointer-events:none; }
</style>
</head>
<body>
  <section class="slide" id="s1">
    <img src="cenas/00-capa-estojo.png" alt="">
    <div class="titulo">direção criativa<br><em>com ia</em></div>
    <div class="handle">@itsemsdesign</div>
    <canvas class="grao" width="1080" height="1350"></canvas>
  </section>
  <section class="slide" id="s2">
    <img src="cenas/00-capa-pedra.png" alt="">
    <div class="titulo">direção criativa<br><em>com ia</em></div>
    <div class="handle">@itsemsdesign</div>
    <canvas class="grao" width="1080" height="1350"></canvas>
  </section>
  <section class="slide" id="s3"><img src="cenas/01-bolsa.png" alt=""></section>
  <section class="slide" id="s4"><img src="cenas/02-gelo.png" alt=""></section>
  <section class="slide" id="s5"><img src="cenas/03-vidro-molhado.png" alt=""></section>
  <section class="slide" id="s6"><img src="cenas/04-flatlay.png" alt=""></section>
  <section class="slide" id="s7"><img src="cenas/05-caixas.png" alt=""></section>
<script>
// grão de papel (opacity-grain)
document.querySelectorAll('.grao').forEach(c=>{const g=c.getContext('2d'),d=g.createImageData(c.width,c.height);
 let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
 for(let i=0;i<d.data.length;i+=4){const v=rnd()*255|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}
 g.putImageData(d,0,0);});
</script>
</body>
</html>
