<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>EMS – direção criativa com ia</title>
<style>
  @font-face { font-family: "Instrument Serif"; font-style: normal; src: url("fontes/InstrumentSerif-Regular.ttf"); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("fontes/InstrumentSerif-Italic.ttf"); }
  @font-face { font-family: "Poppins"; font-weight: 500; src: url("fontes/Poppins-Medium.ttf"); }
  :root { --ivory:#fffbde; --manteiga:#f2cf7a; --pink:#dd34a8; --tinta:#2a1433; --ameixa:#3d1c46; --violeta2:#7b4df2; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1b1b1b; display:flex; flex-wrap:wrap; gap:24px; padding:24px; }
  .slide { position:relative; width:1080px; height:1350px; overflow:hidden; background:var(--ameixa); flex:none; }
  .slide > img.foto { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  /* capa: identidade EMS */
  .veu { position:absolute; inset:0; background:linear-gradient(180deg, rgba(42,20,51,0) 46%, rgba(42,20,51,.62) 100%); }
  .estrela { position:absolute; right:-250px; bottom:-270px; width:820px; height:820px; opacity:.32; transform:rotate(-10deg); }
  .titulo { position:absolute; left:90px; right:90px; top:742px; text-align:center; color:var(--ivory);
            font:400 256px/0.79 "Instrument Serif", serif; letter-spacing:-0.02em; }
  .titulo span { display:block; }
  .titulo em { display:block; margin-top:26px; font:italic 400 96px/1 "Instrument Serif", serif; color:var(--manteiga); letter-spacing:-0.02em; }
  .tag { position:absolute; left:90px; bottom:90px; background:var(--pink); color:var(--ivory);
         font:500 22px/1 "Poppins", sans-serif; padding:10px 14px 9px; border-radius:4px; box-shadow:3px 3px 0 var(--tinta); }
  .grao { position:absolute; inset:0; opacity:.07; mix-blend-mode:overlay; pointer-events:none; }
</style>
</head>
<body>
  <section class="slide" id="s1">
    <img class="foto" src="cenas/01-capa-bolsa.png" alt="">
    <div class="veu"></div>
    <img class="estrela" id="estrela" alt="">
    <div class="titulo"><span>direção</span><span>criativa</span><em>com ia</em></div>
    <div class="tag">@itsemsdesign</div>
    <canvas class="grao" id="grao" width="1080" height="1350"></canvas>
  </section>
  <section class="slide" id="s2"><img class="foto" src="cenas/02-gelo.png" alt=""></section>
  <section class="slide" id="s3"><img class="foto" src="cenas/03-vidro-molhado.png" alt=""></section>
  <section class="slide" id="s4"><img class="foto" src="cenas/04-flatlay.png" alt=""></section>
  <section class="slide" id="s5"><img class="foto" src="cenas/05-caixas.png" alt=""></section>
<script>
// estrela em retícula (HalftoneStar), mesma função do reel-ems
function halftoneStar(color,size=900){
  const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');
  const cx=size/2,cy=size/2,R=size*.49,r=R*.45;const pts=[];
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5;const rr=i%2?r:R;pts.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)]);}
  const path=new Path2D();pts.forEach((p,i)=>i?path.lineTo(...p):path.moveTo(...p));path.closePath();
  g.fillStyle=color;const step=size/64;
  for(let y=step/2;y<size;y+=step)for(let x=step/2;x<size;x+=step){
    if(!g.isPointInPath(path,x,y))continue;
    const d=Math.hypot(x-cx,y-cy)/R;const rad=step*.48*(1-d*.82);
    if(rad>.6){g.beginPath();g.arc(x,y,rad,0,7);g.fill();}
  }
  return c.toDataURL();
}
document.getElementById('estrela').src=halftoneStar('#7b4df2');
// grão de papel
{const c=document.getElementById('grao'),g=c.getContext('2d'),d=g.createImageData(c.width,c.height);
 let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
 for(let i=0;i<d.data.length;i+=4){const v=rnd()*255|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}
 g.putImageData(d,0,0);}
</script>
</body>
</html>
